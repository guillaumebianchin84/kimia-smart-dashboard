name: KIMIA — extension native Énergie Eau Sécurité (isolée)
on:
  push:
    branches:
      - feat/kimia-native-energie-eau-securite-20261027
  workflow_dispatch:
jobs:
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyse du dashboard YAML historique
        run: pip install PyYAML
      - name: Vérifier le module sans effet au chargement
        run: |
          node --check www/kimia-native-extension-v1.js
          node tests/kimia_native_extension_v1.test.cjs
          node tests/kimia_native_extension_snapshot.test.cjs
          node tests/kimia_native_integration_admin_v2.test.cjs
      - name: Vérifier les anciens tests KIMIA
        run: |
          node tests/kimia_v1.test.cjs
          node tests/kimia_routines_v3.test.cjs
          node tests/kimia_routines_v31_conditions.test.cjs
      - name: Préparer le dossier d'installation VM210
        run: |
          mkdir -p livraison/VM210/www livraison/VM210/packages
          cp www/kimia-smart-core-v1.js livraison/VM210/www/
          cp www/kimia-native-extension-v1.js livraison/VM210/www/
          cp packages/kimia_energie_eau_secours_v1.yaml livraison/VM210/packages/
          cp docs/KIMIA_EXTENSION_NATIVE_ENERGIE_EAU_SECURITE_V1.md livraison/VM210/LISEZ-MOI.md
          cd livraison
          zip -r KIMIA-VM210-Energie-Eau-Securite.zip VM210
      - name: Livraison ZIP isolée pour VM210
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-VM210-Energie-Eau-Securite-Installation
          path: livraison/KIMIA-VM210-Energie-Eau-Securite.zip
          if-no-files-found: error
          retention-days: 30
