name: KIMIA v1 - validations
on:
  push:
    branches:
      - feat/kimia-produit-v1-20261025
      - feat/kimia-inventaire-v1-20261026
      - feat/kimia-bandeau-client-20261026
      - feat/kimia-bandeau-marque-20261026
      - feat/kimia-refonte-client-20261026
      - feat/kimia-v14-carte-listes-scenarios-20261026
      - feat/kimia-v15-profils-utilisateurs-20261026
      - feat/kimia-v16-editeur-routines-20261026
      - fix/kimia-v16-affichage-local-20261026
      - fix/kimia-v162-admin-header-20261026
      - fix/kimia-v163-themes-cartes-natives-20261026
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verification JavaScript
        run: |
          node --check www/kimia-smart-core-v1.js
          node --check www/kimia-setup-v1-card.js
          node --check www/kimia-room-manager-v1-card.js
          node --check www/kimia-zigbee-manager-v1-card.js
          node --check www/kimia-scenarios-v1-card.js
          node --check www/kimia-inventory-v1-card.js
          node --check www/kimia-header-toggle-v1-card.js
          node --check www/kimia-local-theme-v16-card.js
          node --check www/kimia-services-v14-card.js
          node --check www/kimia-script-builder-v14-card.js
          node --check www/kimia-user-visibility-v15-card.js
          node --check www/kimia-routine-engine-v16.js
          node --check www/kimia-routine-editor-v16-card.js
          node tests/kimia_v1.test.cjs
          node tests/kimia_v14.test.cjs
          node tests/kimia_v15_admin.test.cjs
          node tests/kimia_v15_profiles.test.cjs
          node tests/kimia_v15_settings.test.cjs
          node tests/kimia_v15_review.test.cjs
          node tests/kimia_v16_routines.test.cjs
          node tests/kimia_inventory_v1.test.cjs
          node tests/kimia_header_toggle_v1.test.cjs
          node tests/kimia_v161_local_preferences.test.cjs
      - name: Verification YAML
        run: |
          pip install PyYAML
          python tests/validate_kimia_yaml.py
      - name: Préparer les cinq fichiers JavaScript KIMIA
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-Smart-5-JavaScript-v1
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-setup-v1-card.js
            www/kimia-room-manager-v1-card.js
            www/kimia-zigbee-manager-v1-card.js
            www/kimia-scenarios-v1-card.js
          retention-days: 30
      - name: Préparer la mise à jour Inventaire et Gestion des pièces
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-Inventaire-et-Pieces-V1
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-room-manager-v1-card.js
            www/kimia-inventory-v1-card.js
            kimia-admin-next-ui-import.yaml
          retention-days: 30

      - name: Préparer la mise à jour du bandeau client KIMIA
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-Controle-Bandeau-Client
          path: |
            www/kimia-header-toggle-v1-card.js
            dashboard-kimia-next-ui-import.yaml
          retention-days: 30

      - name: Télécharger le nouveau moteur et le modèle client refondu
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-Refonte-Client-V13
          path: |
            www/kimia-smart-core-v1.js
            dashboard-kimia-next-ui-import.yaml
            docs/KIMIA_REFONTE_CLIENT_SOURCE_20261026.yaml
          retention-days: 30
      - name: Pack de développement KIMIA V1.4 (non déployé)
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-V14-Development
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-services-v14-card.js
            www/kimia-script-builder-v14-card.js
            kimia-admin-next-ui-import.yaml
            dashboard-kimia-next-ui-import.yaml
            packages/kimia_admin_navigation.yaml
            docs/KIMIA_V14_INSTALLATION.md
          retention-days: 30
      - name: Pack installation KIMIA V1.5 (3 JavaScript + navigation)
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-V15-Revue-Corrections
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-user-visibility-v15-card.js
            docs/KIMIA_V15_PARAMETRES_PORTAIL_20261026.md
            www/kimia-services-v14-card.js
            packages/kimia_admin_navigation.yaml
          retention-days: 30

      - name: Pack KIMIA V1.6 — Routines scripts & automations
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-V16-Routines-Installation
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-routine-engine-v16.js
            www/kimia-routine-editor-v16-card.js
            docs/KIMIA_V16_INSTALLATION.md
          retention-days: 30

      - name: Pack correctif KIMIA V1.6.1 — Apparence locale
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-V161-Correctif-Affichage-Local
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-header-toggle-v1-card.js
            www/kimia-local-theme-v16-card.js
            packages/kimia_client_theme.yaml
            docs/KIMIA_V161_CORRECTIF_AFFICHAGE_LOCAL.md
          retention-days: 30

      - name: Pack correctif KIMIA V1.6.2 — Bandeau admin et thèmes illustrés
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-V162-Correctif-UI-Sans-Regression
          path: |
            www/kimia-smart-core-v1.js
            www/kimia-header-toggle-v1-card.js
            www/kimia-local-theme-v16-card.js
            docs/KIMIA_V162_INSTALLATION_CORRECTIF.md
          retention-days: 30

      - name: Pack ciblé KIMIA V1.6.3 — Cartes natives de thèmes
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-V163-Themes-Cartes-Natives
          path: |
            www/kimia-local-theme-v16-card.js
            docs/KIMIA_V163_THEMES_NATIFS.md
          retention-days: 30
