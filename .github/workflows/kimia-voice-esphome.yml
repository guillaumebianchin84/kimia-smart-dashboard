name: KIMIA Voice - CI Olimex S3 N8R8

on:
  push:
    branches:
      - test/kimia-voice-olimex-n8r8
    paths:
      - 'firmware/kimia-voice/**'
      - '.github/workflows/kimia-voice-esphome.yml'
  pull_request:
    paths:
      - 'firmware/kimia-voice/**'
      - '.github/workflows/kimia-voice-esphome.yml'
  workflow_dispatch:

jobs:
  build:
    name: Validation + compilation Olimex / voix / ecran / tactile / capteurs
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: ghcr.io/esphome/esphome:2026.9.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identifiants FACTICES CI (ne pas flasher)
        shell: bash
        run: |
          cat > firmware/kimia-voice/secrets.yaml <<'EOF'
          wifi_ssid: "KIMIA_CI_FAKE"
          wifi_password: "KIMIA_CI_NOT_REAL_PASSWORD"
          ota_password: "KIMIA_CI_NOT_REAL_OTA_PASSWORD"
          api_key: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          EOF

      - name: Validation configuration ESPHome (Olimex)
        run: esphome config firmware/kimia-voice/kimia_voice_olimex_ci.yaml

      - name: Compilation firmware ESPHome (Olimex)
        run: esphome compile firmware/kimia-voice/kimia_voice_olimex_ci.yaml

      - name: Publier les vrais fichiers binaires de test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KIMIA-Voice-Olimex-CI-NON-FLASHER
          path: |
            firmware/kimia-voice/.esphome/build/kimia-voice-olimex-ci/build/firmware.factory.bin
            firmware/kimia-voice/.esphome/build/kimia-voice-olimex-ci/build/firmware.ota.bin
          if-no-files-found: error
          retention-days: 5
