# KIMIA Voice V6 — ESP32-S3 N16R8 / repérage GPIO REV B, 30/10/2026.
# Ce fichier n'est PAS un ordre de câblage : confirmer repères physiques.
esphome:
  name: kimia-voice-proto
  friendly_name: KIMIA Voice Prototype
  min_version: 2026.10.0
  project:
    name: kimia.voice
    version: "0.1.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# GPIO43/44 sont utilisés par l'I2S, pas par les logs UART.
logger:
  level: INFO
  baud_rate: 0
  logs:
    i2s_audio: WARN
    micro_wake_word: INFO
    voice_assistant: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 10min
  ap:
    ssid: "KIMIA-VOICE-SECOURS"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# BUS I2C COMMUN : XVF3800, Waveshare CST816S, BME280 3,3 V logique.
i2c:
  id: kimia_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz
  scan: true

button:
  - platform: restart
    name: "KIMIA redémarrer"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "KIMIA signal Wi-Fi"
    update_interval: 60s
