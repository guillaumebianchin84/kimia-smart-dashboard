# KIMIA — V6 EXPERIMENTALE (ESPHome 2026.10.2)
# Base materielle : V5 validee (LCD ST77916 + tactile CST816T).
# On introduit LVGL : clignement, bouche animee et cycle d'etats au toucher.
# AUCUN pilotage audio/micro/XVF3800 dans ce firmware.
# IMPORTANT : NE PAS ajouter reset_pin GPIO18 dans touchscreen.
# LCD : ESP-VOCAT QSPI 3 MHz ; ne pas augmenter sans essai separe.
esphome:
  name: kimia-ecran-test
  friendly_name: KIMIA Ecran Test

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

spi:
  - id: kimia_qspi
    type: quad
    interface: spi2
    clk_pin: GPIO10
    data_pins:
      - GPIO11
      - GPIO12
      - GPIO13
      - GPIO14

display:
  - platform: mipi_spi
    id: kimia_display
    model: ESP-VOCAT
    spi_id: kimia_qspi
    bus_mode: quad
    cs_pin: GPIO15
    reset_pin: GPIO16
    dimensions:
      width: 360
      height: 360
    data_rate: 3MHz
    color_order: rgb
    auto_clear_enabled: false
    update_interval: never
    # Pas de lambda : c'est LVGL qui dessine.

i2c:
  id: kimia_touch_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 100kHz
  scan: false

touchscreen:
  - platform: cst816
    id: kimia_touch
    i2c_id: kimia_touch_i2c
    display: kimia_display
    interrupt_pin: GPIO21
    skip_probe: true
    # NE PAS activer reset_pin: GPIO18 (ecran noir en V3).
    on_touch:
      - lambda: |-
          ESP_LOGI("KIMIA_TOUCH", "TOUCH x=%d y=%d", touch.x, touch.y);

output:
  - platform: ledc
    id: lcd_backlight
    pin: GPIO17

light:
  - platform: monochromatic
    id: lcd_light
    output: lcd_backlight
    restore_mode: ALWAYS_ON

globals:
  - id: kimia_mode
    type: int
    restore_value: no
    initial_value: '0' # 0 repos, 1 ecoute, 2 reflexion, 3 parole, 4 erreur
  - id: kimia_mouth_open
    type: bool
    restore_value: no
    initial_value: 'false'

lvgl:
  displays: [kimia_display]
  touchscreens: [kimia_touch]
  buffer_size: 25%
  pages:
    - id: kimia_face
      bg_color: 0x07101F
      widgets:
        - label:
            x: 157
            y: 35
            text: "KIMIA"
            text_color: 0x5CE1E6

        - label:
            id: kimia_status
            x: 140
            y: 67
            text: "Repos"
            text_color: 0xE1EFF4

        - obj:
            id: kimia_eye_left
            x: 83
            y: 113
            width: 76
            height: 78
            radius: 36
            bg_color: 0x5CE1E6
            border_width: 0
            pad_all: 0
            clip_corner: true
            scrollable: false
            widgets:
              - obj:
                  id: kimia_pupil_left
                  x: 30
                  y: 29
                  width: 17
                  height: 22
                  radius: 11
                  bg_color: 0x0E1F2D
                  border_width: 0
                  scrollable: false

        - obj:
            id: kimia_eye_right
            x: 201
            y: 113
            width: 76
            height: 78
            radius: 36
            bg_color: 0x5CE1E6
            border_width: 0
            pad_all: 0
            clip_corner: true
            scrollable: false
            widgets:
              - obj:
                  id: kimia_pupil_right
                  x: 30
                  y: 29
                  width: 17
                  height: 22
                  radius: 11
                  bg_color: 0x0E1F2D
                  border_width: 0
                  scrollable: false

        - obj:
            id: kimia_mouth
            x: 149
            y: 224
            width: 62
            height: 11
            radius: 6
            bg_color: 0xE1EFF4
            border_width: 0
            scrollable: false

        # Bouton de DEMONSTRATION : aucun controle physique du micro.
        - button:
            id: kimia_mode_button
            x: 123
            y: 279
            width: 114
            height: 45
            radius: 15
            bg_color: 0x1B344D
            border_width: 0
            on_click:
              - script.execute: kimia_next_mode
            widgets:
              - label:
                  align: CENTER
                  text: "MODE"
                  text_color: 0xFFFFFF

script:
  - id: kimia_next_mode
    mode: restart
    then:
      - lambda: |-
          id(kimia_mode) = (id(kimia_mode) + 1) % 5;
          id(kimia_mouth_open) = false;
          ESP_LOGI("KIMIA", "Mode visage = %d", id(kimia_mode));
      - script.execute: kimia_refresh_mode

  - id: kimia_refresh_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 0;'
          then:
            - lvgl.label.update:
                id: kimia_status
                text: "Repos"
            - lvgl.widget.update:
                id: [kimia_eye_left, kimia_eye_right]
                bg_color: 0x5CE1E6
            - lvgl.widget.update:
                id: kimia_mouth
                x: 149
                y: 224
                width: 62
                height: 11
                radius: 6
                bg_color: 0xE1EFF4
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 1;'
          then:
            - lvgl.label.update:
                id: kimia_status
                text: "Ecoute"
            - lvgl.widget.update:
                id: [kimia_eye_left, kimia_eye_right]
                bg_color: 0x9EFAED
            - lvgl.widget.update:
                id: kimia_mouth
                x: 168
                y: 214
                width: 24
                height: 28
                radius: 12
                bg_color: 0xE1EFF4
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 2;'
          then:
            - lvgl.label.update:
                id: kimia_status
                text: "Reflexion"
            - lvgl.widget.update:
                id: [kimia_eye_left, kimia_eye_right]
                bg_color: 0x5CE1E6
            - lvgl.widget.update:
                id: kimia_mouth
                x: 168
                y: 225
                width: 24
                height: 7
                radius: 3
                bg_color: 0xE1EFF4
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 3;'
          then:
            - lvgl.label.update:
                id: kimia_status
                text: "Parole"
            - lvgl.widget.update:
                id: [kimia_eye_left, kimia_eye_right]
                bg_color: 0x5CE1E6
            - lvgl.widget.update:
                id: kimia_mouth
                x: 165
                y: 224
                width: 30
                height: 9
                radius: 5
                bg_color: 0xE1EFF4
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 4;'
          then:
            - lvgl.label.update:
                id: kimia_status
                text: "Erreur"
            - lvgl.widget.update:
                id: [kimia_eye_left, kimia_eye_right]
                bg_color: 0xFFAE67
            - lvgl.widget.update:
                id: kimia_mouth
                x: 154
                y: 224
                width: 52
                height: 8
                radius: 4
                bg_color: 0xFF7777

  - id: kimia_blink
    mode: single
    then:
      - lvgl.widget.update:
          id: [kimia_pupil_left, kimia_pupil_right]
          hidden: true
      - lvgl.widget.update:
          id: [kimia_eye_left, kimia_eye_right]
          y: 148
          height: 8
      - delay: 180ms
      - lvgl.widget.update:
          id: [kimia_eye_left, kimia_eye_right]
          y: 113
          height: 78
      - lvgl.widget.update:
          id: [kimia_pupil_left, kimia_pupil_right]
          hidden: false

interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(kimia_mode) != 3;'
          then:
            - script.execute: kimia_blink

  - interval: 450ms
    then:
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 3;'
          then:
            - lambda: |-
                id(kimia_mouth_open) = !id(kimia_mouth_open);
            - if:
                condition:
                  lambda: 'return id(kimia_mouth_open);'
                then:
                  - lvgl.widget.update:
                      id: kimia_mouth
                      x: 165
                      y: 216
                      width: 30
                      height: 24
                      radius: 12
                else:
                  - lvgl.widget.update:
                      id: kimia_mouth
                      x: 165
                      y: 224
                      width: 30
                      height: 9
                      radius: 5
