                hidden: false

interval:
  # Le slide se referme automatiquement apres 12 secondes.
  # Pas d'affichage automatique periodique a ce stade : valider d'abord le rendu.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(kimia_measures_visible) && !id(kimia_screen_sleeping) &&
                     ((uint32_t) (millis() - id(kimia_measures_opened_ms)) >= 12000UL);
          then:
            - script.execute: kimia_show_face

  # Diagnostic non-intrusif : laisse le temps a la premiere mesure (60s),
  # puis verifie la presence des trois valeurs sans fausse alerte initiale.
  - interval: 90s
    then:
      - lambda: |-
          if (!id(kimia_temperature).has_state() ||
              !id(kimia_humidite).has_state() ||
              !id(kimia_pression).has_state()) {
            ESP_LOGW("KIMIA_BME280", "AUCUNE MESURE complete publiee : verifier lecture et alimentation du capteur");
          } else {
            ESP_LOGI("KIMIA_BME280", "OK T=%.2f C HR=%.2f %% P=%.2f hPa",
                     id(kimia_temperature).state,
                     id(kimia_humidite).state,
                     id(kimia_pression).state);
          }

  # Veille apres 120 s sans toucher : valeur de test, modifiable plus tard.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (id(kimia_screen_sleeping) || id(kimia_touch_active)) return false;
              if (id(kimia_last_activity_ms) == 0) {
                id(kimia_last_activity_ms) = millis();
                return false;
              }
              return (uint32_t) (millis() - id(kimia_last_activity_ms)) >= 120000UL;
          then:
            - script.execute: kimia_screen_sleep

  # Horloge interne de l'animation : espacements aleatoires.
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              if (id(kimia_mode) == 2 || id(kimia_mode) == 3 || id(kimia_mode) == 4) return false;
              const uint32_t now = millis();
              if (id(kimia_next_blink_ms) == 0) {
                id(kimia_next_blink_ms) = now + 2000 + (random_uint32() % 2500);
                return false;
              }
              if ((int32_t) (now - id(kimia_next_blink_ms)) < 0) return false;
              id(kimia_next_blink_ms) = now + 3400 + (random_uint32() % 4500);
              return true;
          then:
            - script.execute: kimia_blink

  # Regard discret : gauche, droite, haut, bas, centre.
  - interval: 700ms
    then:
      - if:
          condition:
            lambda: |-
              if (id(kimia_mode) != 0) return false;
              const uint32_t now = millis();
              if (id(kimia_next_gaze_ms) == 0) {
                id(kimia_next_gaze_ms) = now + 1800 + (random_uint32() % 2200);
                return false;
              }
              if ((int32_t) (now - id(kimia_next_gaze_ms)) < 0) return false;
              id(kimia_next_gaze_ms) = now + 2600 + (random_uint32() % 4000);
              id(kimia_gaze_direction) = random_uint32() % 5;
              return true;
          then:
            - script.execute: kimia_move_gaze

  # Ecoute verticale - animations 250ms (2 sec par cycle).
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 1 && !id(kimia_screen_sleeping);'
          then:
            - lambda: |-
                id(kimia_listening_step) = (id(kimia_listening_step) + 1) % 8;
            - script.execute: kimia_listening_motion

  # Reflexion circulaire - une orbite complete toutes les 1 sec.
  - interval: 125ms
    then:
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 2 && !id(kimia_screen_sleeping);'
          then:
            - lambda: |-
                id(kimia_thinking_step) = (id(kimia_thinking_step) + 1) % 8;
            - script.execute: kimia_thinking_motion

  # Parole fictive : 4 ouvertures de bouche aleatoires, cadence acceleree.
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: 'return id(kimia_mode) == 3;'
          then:
            - lambda: |-
                id(kimia_mouth_shape) = random_uint32() % 4;
            - script.execute: kimia_animate_mouth
