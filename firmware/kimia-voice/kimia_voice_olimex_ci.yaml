# KIMIA Voice V5 / Olimex ESP32-S3-DevKit-LiPo N8R8
# ESSAI DE COMPILATION UNIQUEMENT, sans materiel.
# XVF3800 avec XIAO dessoude -> signaux I2S/I2C externe.
# Ecran Waveshare 1.85 pouce nu (ST77916 QSPI + CST816S tactile)
# SHT45 I2C + radar LD2410 UART.
# NE PAS FLASHER LE BINAIRE CI / NE PAS SOUDER SANS CONTROLE ELECTRIQUE.
#
# IMPORTANT: la prise de signaux sur la carte XVF3800 et le firmware XMOS
# fonctionnant en I2S doivent etre verifies, de meme que les rails 3.3/5 V.
# Le pilote ecran JC3636W518 est un profil temporaire : bien qu'il utilise
# ST77916 360x360, la sequence d'initialisation Waveshare n'est pas validee.

substitutions:
  name: kimia-voice-olimex-ci
  friendly_name: KIMIA Voice Olimex CI
  respeaker_ref: 2026.10.1

packages:
  base: !include packages/olimex-base.yaml
  hardware: !include packages/olimex-hardware.yaml
  remaining:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

# L'Olimex utilise le meme SoC + meme flash/psram qu'un S3 DevKit N8R8.
# La declaration esp32/psram du package reste a 8MB + PSRAM Octal.
# Identifiants de test CI (fichier secrets.yaml genere par GitHub Actions)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# Raccordements XVF definitifs dans packages/olimex-base.yaml et
# packages/olimex-hardware.yaml (sans redefinir des entites en double).

# Ecran 360 x 360, QSPI 4 lignes
spi:
  - id: kimia_lcd_qspi
    type: quad
    clk_pin: GPIO10
    data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

display:
  - platform: mipi_spi
    id: kimia_lcd
    model: JC3636W518
    bus_mode: quad
    spi_id: kimia_lcd_qspi
    cs_pin: GPIO15
    reset_pin: GPIO16
    data_rate: 20MHz
    dimensions:
      width: 360
      height: 360
    invert_colors: true
    color_order: rgb
    update_interval: 1s
    lambda: |-
      it.fill(Color(0, 0, 0));
      it.filled_circle(180, 180, 32, Color(17, 180, 120));

output:
  - platform: ledc
    pin: GPIO1
    id: kimia_lcd_backlight_pwm

light:
  - platform: monochromatic
    id: kimia_lcd_backlight
    name: "KIMIA rétroéclairage"
    output: kimia_lcd_backlight_pwm
    restore_mode: ALWAYS_ON

# Controleur tactile Waveshare CST816S (sur le meme bus I2C)
touchscreen:
  - platform: cst816
    id: kimia_touch
    display: kimia_lcd
    interrupt_pin: GPIO2
    reset_pin: GPIO4
    i2c_id: internal_i2c
    skip_probe: true

# SHT45 (temperatures et humidite)
sensor:
  - platform: sht4x
    i2c_id: internal_i2c
    address: 0x44
    temperature:
      name: "KIMIA temperature"
    humidity:
      name: "KIMIA humidite"
    update_interval: 30s

# Presence HLK LD2410: 256000 bauds
uart:
  - id: kimia_ld2410_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  - id: kimia_ld2410
    uart_id: kimia_ld2410_uart

binary_sensor:
  - platform: ld2410
    ld2410_id: kimia_ld2410
    has_target:
      name: "KIMIA presence"
    has_moving_target:
      name: "KIMIA presence mouvement"
    has_still_target:
      name: "KIMIA presence statique"
