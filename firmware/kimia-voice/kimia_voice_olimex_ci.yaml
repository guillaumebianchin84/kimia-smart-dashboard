# KIMIA Voice V5 / Olimex ESP32-S3-DevKit-LiPo N8R8
# ESSAI DE COMPILATION UNIQUEMENT, sans materiel.
# XVF3800 avec XIAO dessoude -> signaux I2S/I2C externe.
# Ecran Waveshare 1.85 pouce nu (ST77916 QSPI + CST816S tactile)
# SHT45 I2C + radar LD2410 UART.
# NE PAS FLASHER LE BINAIRE CI / NE PAS SOUDER SANS CONTROLE ELECTRIQUE.
#
# IMPORTANT: la prise de signaux sur la carte XVF3800 et le firmware XMOS
# fonctionnant en I2S doivent etre verifies, de meme que les rails 3.3/5 V.
# Le pilote ecran JC3636W518 est un profil temporaire : bien qu'il utilise
# ST77916 360x360, la sequence d'initialisation Waveshare n'est pas validee.

substitutions:
  name: kimia-voice-olimex-ci
  friendly_name: KIMIA Voice Olimex CI
  respeaker_ref: 2026.10.1

packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

# L'Olimex utilise le meme SoC + meme flash/psram qu'un S3 DevKit N8R8.
# La declaration esp32/psram du package reste a 8MB + PSRAM Octal.
# Identifiants de test CI (fichier secrets.yaml genere par GitHub Actions)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# REDIRECTION SUR PINS REELLEMENT EXPOSES PAR OLIMEX
# GPIO5/6 sont deja lies aux mesures puissance/batterie sur Olimex.
# GPIO43/44 sont lies au convertisseur USB-UART: non utilises pour I2S.
# La fusion par id ESPHome doit substituer les entrees des packages formatBCE.
i2c:
  - id: internal_i2c
    sda: GPIO48
    scl: GPIO47
    scan: true
    frequency: 400kHz

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO40
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO41
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

# Ecran 360 x 360, QSPI 4 lignes
spi:
  - id: kimia_lcd_qspi
    type: quad
    clk_pin: GPIO10
    data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

display:
  - platform: mipi_spi
    id: kimia_lcd
    model: JC3636W518
    bus_mode: quad
    spi_id: kimia_lcd_qspi
    cs_pin: GPIO15
    reset_pin: GPIO16
    data_rate: 20MHz
    dimensions:
      width: 360
      height: 360
    invert_colors: true
    color_order: rgb
    update_interval: 1s
    lambda: |-
      it.fill(Color(0, 0, 0));
      it.filled_circle(180, 180, 32, Color(17, 180, 120));

output:
  - platform: ledc
    pin: GPIO1
    id: kimia_lcd_backlight_pwm

light:
  - platform: monochromatic
    id: kimia_lcd_backlight
    name: "KIMIA rétroéclairage"
    output: kimia_lcd_backlight_pwm
    restore_mode: ALWAYS_ON

# Controleur tactile Waveshare CST816S (sur le meme bus I2C)
touchscreen:
  - platform: cst816
    id: kimia_touch
    display: kimia_lcd
    interrupt_pin: GPIO2
    reset_pin: GPIO4
    i2c_id: internal_i2c
    skip_probe: true

# SHT45 (temperatures et humidite)
sensor:
  - platform: sht4x
    i2c_id: internal_i2c
    address: 0x44
    temperature:
      name: "KIMIA temperature"
    humidity:
      name: "KIMIA humidite"
    update_interval: 30s

# Presence HLK LD2410: 256000 bauds
uart:
  - id: kimia_ld2410_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  - id: kimia_ld2410
    uart_id: kimia_ld2410_uart

binary_sensor:
  - platform: ld2410
    ld2410_id: kimia_ld2410
    has_target:
      name: "KIMIA presence"
    has_moving_target:
      name: "KIMIA presence mouvement"
    has_still_target:
      name: "KIMIA presence statique"
