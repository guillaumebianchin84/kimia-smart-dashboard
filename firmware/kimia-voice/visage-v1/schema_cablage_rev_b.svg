<text x="55" y="1054" font-family="Arial,sans-serif" font-size="15" fill="#805a22">BH1750 luminosite : future option I2C</text>
<text x="55" y="1084" font-family="Arial,sans-serif" font-size="14" fill="#805a22">Verifier la reference exacte du capteur livre.</text>
