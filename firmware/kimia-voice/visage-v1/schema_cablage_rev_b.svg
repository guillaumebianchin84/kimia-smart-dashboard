<text x="55" y="959" font-family="Arial,sans-serif" font-size="16" fill="#4e432c">Temperature / humidite I2C (si compatible)</text>
<text x="55" y="991" font-family="Arial,sans-serif" font-size="17" fill="#4e432c">VCC 3V3  -  GND  -  SDA GPIO5</text>
