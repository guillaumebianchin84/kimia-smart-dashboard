<text x="577" y="284" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff">U1 - ESP32-S3 N16R8</text>
<text x="577" y="335" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#225b88">OTRONIC OT1022 / DevKitC-1</text>
<text x="577" y="363" font-family="Arial,sans-serif" font-size="17" fill="#516b81">16 Mo Flash - 8 Mo PSRAM - ESPHome/LVGL</text>
<text x="580" y="409" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1c577a">Bus audio XVF3800</text>
