<text x="53" y="154" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#8b4c0f">ETUDE - NE PAS SOUDER AVANT VALIDATION</text>
<text x="53" y="179" font-family="Arial,sans-serif" font-size="16" fill="#8b4c0f">XVF3800 livre avec XIAO : verifier isolement, firmware I2S, reperage des pads et alimentation avant raccordement.</text>
