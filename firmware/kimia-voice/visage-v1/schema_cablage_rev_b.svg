<text x="1147" y="737" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff">Alimentation / HP</text>
<text x="1148" y="785" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#4b3d5e">Source 5 V stabilisee (~3 A)</text>
<text x="1148" y="815" font-family="Arial,sans-serif" font-size="16" fill="#4b3d5e">+5V via protection vers :</text>
<text x="1164" y="841" font-family="Arial,sans-serif" font-size="16" fill="#4b3d5e">ESP 5V / LCD VCC / XVF 5V_IN</text>
<text x="1148" y="875" font-family="Arial,sans-serif" font-size="16" fill="#4b3d5e">GND commun aux trois modules</text>
