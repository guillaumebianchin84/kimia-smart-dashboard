<text x="1148" y="931" font-family="Arial,sans-serif" font-size="17" fill="#4b3d5e">Visaton FR7 4 ohms :</text>
<text x="1148" y="960" font-family="Arial,sans-serif" font-size="16" fill="#4b3d5e">sur JST amplifie XVF seulement.</text>
<text x="1148" y="989" font-family="Arial,sans-serif" font-size="15" fill="#b03d3a">NE PAS connecter le HP au GND.</text>
<text x="1148" y="1024" font-family="Arial,sans-serif" font-size="15" fill="#805083">Buttons MIC/SON/+/− : LVGL,</text>
<text x="1148" y="1050" font-family="Arial,sans-serif" font-size="15" fill="#805083">aucun GPIO additionnel.</text>
<text x="1148" y="1082" font-family="Arial,sans-serif" font-size="13" fill="#805083">Aucun mute physique dans la demo actuelle.</text>
