    back_path: /kimia-next/parametres
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            show_label: false
            grid_options:
              columns: full
              rows: auto
            tap_action:
              action: none
            custom_fields:
              logo: >-
                [[[ return '<div
                style="font-size:23px;font-weight:900;letter-spacing:-.8px;white-space:nowrap;">KIMIA
                <span style="color:#3FD6CB">Smart</span><div
                style="font-size:10px;letter-spacing:2px;font-weight:600;color:var(--secondary-text-color);margin-top:-2px">by
                PROMAINT</div></div>'; ]]]
              slogan: >-
                [[[ return '<div
                style=\"font-size:20px;font-weight:800;letter-spacing:.2px;\">Apparence</div>';
                ]]]
              localisation: >-
                [[[ return '<div
                style="font-size:12px;font-weight:600;opacity:.8;">LIBREVILLE ·
                GABON</div>'; ]]]
            styles:
              card:
                - background: >-
                    linear-gradient(105deg, rgba(12,137,147,.25),
                    var(--card-background-color) 68%)
                - border: 1px solid rgba(56,205,203,.28)
                - border-radius: 18px
                - padding: 9px 18px
                - box-shadow: 0 5px 22px rgba(0,25,35,.12)
              grid:
                - grid-template-areas: >-
                    [[[ return window.innerWidth < 680 ? '"logo localisation"
                    "slogan slogan"' : '"logo slogan localisation"'; ]]]
                - grid-template-columns: >-
                    [[[ return window.innerWidth < 680 ? '1fr auto' : '225px 1fr
                    150px'; ]]]
                - grid-template-rows: auto
                - align-items: center
              custom_fields:
                logo:
                  - text-align: left
                  - justify-self: start
                slogan:
                  - text-align: center
                  - color: var(--primary-text-color)
                localisation:
                  - text-align: right
                  - justify-self: end
                  - color: var(--secondary-text-color)
      - type: grid
        column_span: 2
        cards:
          - type: shortcut
            label: Retour aux paramètres
            description: Revenir au menu principal
            icon: mdi:arrow-left
            color: teal
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: navigate
              navigation_path: /kimia-next/parametres
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Personnalisation
            icon: mdi:cog-outline
          - type: markdown
            content: >-
              Retrouvez ici les thèmes KIMIA existants, sans changer leurs
              couleurs ni leur fonctionnement.
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Mes thèmes
            icon: mdi:palette-outline
          - type: custom:kimia-local-theme-v16-card
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 2
        cards:
          - type: custom:navbar-card
            routes:
              - url: /kimia-next/accueil
                icon: mdi:home
                label: Accueil
              - url: /kimia-next/pieces
                icon: mdi:floor-plan
                label: Pièces
                hidden: >-
                  [[[ return states["input_boolean.kimia_onglet_pieces"]?.state
                  !== "on"; ]]]
              - url: /kimia-next/lumieres
                icon: mdi:lightbulb-on
                label: Lumières
                hidden: >
                  [[[ return
                  states["input_boolean.kimia_onglet_lumieres"]?.state ===
                  "off"; ]]]
              - url: /kimia-next/volets
                icon: mdi:window-shutter
                label: Volets
                hidden: >
                  [[[ return states["input_boolean.kimia_onglet_volets"]?.state
                  === "off"; ]]]
              - url: /kimia-next/climatisation
                icon: mdi:air-conditioner
                label: Clim
                hidden: >
                  [[[ return
                  states["input_boolean.kimia_onglet_climatisation"]?.state ===
                  "off"; ]]]
              - url: /kimia-next/musique
                icon: mdi:music
                label: Musique
                hidden: >
                  [[[ return states["input_boolean.kimia_onglet_musique"]?.state
                  === "off"; ]]]
              - url: /kimia-next/securite
                icon: mdi:shield-home-outline
                label: Sécurité
                hidden: >
                  [[[ return
                  states["input_boolean.kimia_onglet_securite"]?.state ===
                  "off"; ]]]
              - url: /kimia-next/prises
                icon: mdi:power-socket-eu
                label: Prises
                hidden: >
                  [[[ return states["input_boolean.kimia_onglet_prises"]?.state
                  === "off"; ]]]
              - url: /kimia-next/carte
                icon: mdi:map-marker-radius-outline
                label: Carte
                hidden: >-
                  [[[ return states["input_boolean.kimia_onglet_carte"]?.state
                  !== "on"; ]]]
              - url: /kimia-next/listes
                icon: mdi:format-list-checks
                label: Listes
                hidden: >-
                  [[[ return states["input_boolean.kimia_onglet_listes"]?.state
                  !== "on"; ]]]
              - url: /kimia-next/actualites
                icon: mdi:newspaper-variant-outline
                label: Actualités
                hidden: >
                  [[[ return
                  states["input_boolean.kimia_onglet_actualites"]?.state ===
                  "off"; ]]]
              - url: /kimia-next/parametres
                icon: mdi:cog-outline
                label: Réglages
                hidden: >
                  [[[ return
                  states["input_boolean.kimia_onglet_parametres"]?.state ===
                  "off"; ]]]
            desktop:
              mode: floating
              position: left
              show_labels: never
