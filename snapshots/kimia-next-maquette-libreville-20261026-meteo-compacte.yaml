              perform_action: script.turn_on
              target:
                entity_id: script.kimia_au_lit
          - type: shortcut
            grid_options:
              columns: 12
              rows: 1
            label: Départ
            description: Activer le scénario de départ
            icon: mdi:door-open
            color: green
            tap_action:
