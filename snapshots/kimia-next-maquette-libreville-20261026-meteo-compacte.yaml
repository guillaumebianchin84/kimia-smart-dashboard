                style="font-size:10px;letter-spacing:2px;font-weight:600;color:var(--secondary-text-color);margin-top:-2px">by
                PROMAINT</div></div>'; ]]]
              slogan: >-
                [[[ return '<div
                style=\"font-size:20px;font-weight:800;letter-spacing:.2px;\">Accueil</div>';
