title: Configuration client
views:
  - title: Configuration
    path: configuration
    icon: mdi:tune-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Mon logement
            icon: mdi:floor-plan
          - type: markdown
            content: >-
              Le plan interactif Maquette est désormais l'accueil de KIMIA.
              L'installateur peut y associer les lumières, volets et capteurs, et configurer les scénarios.
          - type: button
            name: Ouvrir ma maison
            icon: mdi:floor-plan
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/accueil
            grid_options:
              columns: 12
              rows: 2
          - type: heading
            heading: Personnaliser KIMIA
            icon: mdi:palette-outline
          - type: markdown
            content: >-
              ### Votre maison, votre ambiance
    
              Choisissez un style pour les écrans de la maison.
              Vous pourrez en changer à tout moment.
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: >-
              **Style sélectionné :** {{ states('input_select.kimia_theme_global') }}
    
              {% if states('input_select.kimia_theme_global') not in [
                'KIMIA Gris Premium', 'KIMIA Clair', 'KIMIA Sombre',
              'KIMIA Signature', 'KIMIA Vert Sauge',
              'KIMIA Violet Nuit', 'KIMIA Sable Doré',
              'KIMIA Terracotta'] %}
              *Configuration en cours. Prévenez votre installateur.*
              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: "Gris Premium"
            icon: mdi:palette
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Gris Premium"
            grid_options:
              columns: 6
              rows: 2
            card_mod:
              style: |
                ha-card {
                  background: #353D46 !important;
                  color: #F4F7FA !important;
                  border: 2px solid #36C8BE !important;
                  border-radius: 18px !important;
                  box-shadow: 0 4px 12px rgba(0,0,0,.10);
                }
                ha-icon { color: #36C8BE !important; }
          - type: button
            name: "Clair"
            icon: mdi:weather-sunny
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Clair"
            grid_options:
              columns: 6
              rows: 2
            card_mod:
              style: |
                ha-card {
                  background: #FFFFFF !important;
                  color: #1A3143 !important;
                  border: 2px solid #008F91 !important;
                  border-radius: 18px !important;
                  box-shadow: 0 4px 12px rgba(0,0,0,.10);
                }
                ha-icon { color: #008F91 !important; }
          - type: button
            name: "Sombre"
            icon: mdi:weather-night
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Sombre"
            grid_options:
              columns: 6
              rows: 2
            card_mod:
              style: |
                ha-card {
                  background: #1A2A3A !important;
                  color: #F0F6FA !important;
                  border: 2px solid #3BDBC4 !important;
                  border-radius: 18px !important;
                  box-shadow: 0 4px 12px rgba(0,0,0,.10);
                }
                ha-icon { color: #3BDBC4 !important; }
          - type: button
            name: "Signature"
            icon: mdi:home-heart
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Signature"
            grid_options:
              columns: 6
              rows: 2
            card_mod:
              style: |
                ha-card {
                  background: #10446D !important;
                  color: #FFFFFF !important;
                  border: 2px solid #28CEC0 !important;
                  border-radius: 18px !important;
                  box-shadow: 0 4px 12px rgba(0,0,0,.10);
                }
                ha-icon { color: #28CEC0 !important; }
          - type: button
            name: "Vert Sauge"
            icon: mdi:leaf
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Vert Sauge"
            card_mod:
              style: |
                ha-card {
                  background: #EDF4EA !important;
                  color: #223A2E !important;
                  border: 2px solid #379C75 !important;
                  border-radius: 18px !important;
                }
                ha-icon { color: #379C75 !important; }
          - type: button
            name: "Violet Nuit"
            icon: mdi:weather-night
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Violet Nuit"
            card_mod:
              style: |
                ha-card {
                  background: #29233E !important;
                  color: #F5F0FB !important;
                  border: 2px solid #AA80F3 !important;
                  border-radius: 18px !important;
                }
                ha-icon { color: #AA80F3 !important; }
          - type: button
            name: "Sable Doré"
            icon: mdi:weather-sunny
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Sable Doré"
            card_mod:
              style: |
                ha-card {
                  background: #FFFDF7 !important;
                  color: #473723 !important;
                  border: 2px solid #C79437 !important;
                  border-radius: 18px !important;
                }
                ha-icon { color: #C79437 !important; }
          - type: button
            name: "Terracotta"
            icon: mdi:fireplace
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.kimia_theme_global
              data:
                option: "KIMIA Terracotta"
            card_mod:
              style: |
                ha-card {
                  background: #45312D !important;
                  color: #FFF3EB !important;
                  border: 2px solid #ED8C66 !important;
                  border-radius: 18px !important;
                }
                ha-icon { color: #ED8C66 !important; }
          - type: entities
            title: Choisir dans la liste
            entities:
              - entity: input_select.kimia_theme_global
                name: Style de la maison
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Mes préférences
            icon: mdi:home-heart
          - type: markdown
            content: >-
              **L'apparence est commune à la maison.**
    
              Le thème choisi s'applique par défaut à tous les dashboards
              Home Assistant, et non uniquement à KIMIA.
    
              Si votre écran ne change pas : dans votre **profil Home Assistant**,
              choisissez **Utiliser le thème par défaut**. Un thème personnel
              sélectionné dans le profil a toujours priorité.
    
              *Les automatismes, les commandes et la configuration
              technique ne sont pas modifiés par ce réglage.*
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: Revenir à l'accueil
            icon: mdi:home-outline
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/accueil
            grid_options:
              columns: 12
              rows: 2
      - type: grid
        cards:
          - type: heading
            heading: Contenu de l'accueil
            icon: mdi:view-dashboard-outline
          - type: markdown
            content: >-
              L'accueil réunit le plan interactif, les raccourcis,
              la météo et un aperçu du journal.
              Les panneaux et widgets sont personnalisés
              par l'installateur dans l'éditeur Maquette.
              Les actualités détaillées restent disponibles
              dans leur propre onglet.
          - type: heading
            heading: Maintenance
            icon: mdi:wrench-clock
          - type: markdown
            content: >-
              Un redémarrage de Home Assistant peut être lancé
              depuis **Maintenance installateur**, sous un compte
              administrateur et après confirmation.
          - type: button
            name: Maintenance installateur (administrateur)
            icon: mdi:shield-account-outline
            tap_action:
              action: navigate
              navigation_path: /kimia-maintenance/maintenance
            grid_options:
              columns: 12
              rows: 2
