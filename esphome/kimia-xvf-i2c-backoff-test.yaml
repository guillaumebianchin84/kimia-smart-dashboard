# KIMIA XVF3800 — diagnostic backoff I2C azimuth
# TEST ONLY. Ikabot is not changed.
substitutions:
  name: kimia-xvf-voice-test
  friendly_name: "KIMIA XVF Voice Test"
  respeaker_ref: e9b11374c7bd9d3ba95ce084dfd30860eb7e4bc7
  log_level: INFO

packages:
  kimia_base:
    url: https://github.com/guillaumebianchin84/kimia-smart-dashboard
    ref: kimia-xvf-i2c-backoff-test
    refresh: 0s
    files:
      - packages/base.yaml
  respeaker_functions:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: e9b11374c7bd9d3ba95ce084dfd30860eb7e4bc7
    refresh: 0s
    files:
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB

microphone:
  - id: !extend i2s_mics
    i2s_din_pin: GPIO1

speaker:
  - id: !extend i2s_audio_speaker
    i2s_dout_pin: GPIO2

# Do not flash or replace the XMOS firmware 1.0.7.
respeaker_xvf3800:
  firmware: !remove
  led_beam_sensor:
    update_interval: 500ms
  mute_switch:
    update_interval: never

i2c:
  - id: !extend internal_i2c
    frequency: 100kHz

interval:
  - id: !extend led_animation_interval
    interval: 500ms

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret kimia_api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret kimia_ota_password
