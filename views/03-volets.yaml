title: Volets
path: volets
icon: mdi:window-shutter
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Pièces de vie
        icon: mdi:window-shutter-open
      - type: tile
        entity: input_boolean.kimia_volet_salon_ouvert
        name: Volet salon ouvert (démo)
      - type: tile
        entity: input_boolean.kimia_volet_cuisine_ouvert
        name: Volet cuisine ouvert (démo)
  - type: grid
    cards:
      - type: heading
        heading: Chambres
        icon: mdi:bed-outline
      - type: tile
        entity: input_boolean.kimia_volet_chambre_ouvert
        name: Volet chambre ouvert (démo)
  - type: grid
    cards:
      - type: heading
        heading: Commandes générales
        icon: mdi:gesture-tap
      - type: button
        name: Tout ouvrir
        icon: mdi:window-shutter-open
        tap_action:
          action: perform-action
          perform_action: script.kimia_volets_ouvrir
      - type: button
        name: Tout fermer
        icon: mdi:window-shutter
        tap_action:
          action: perform-action
          perform_action: script.kimia_volets_fermer
      - type: markdown
        content: >-
          Les vrais moteurs devront être reliés à une commande adaptée
          et reconnus comme entités **cover**. Un relais seul ne
          suffit pas à garantir un pilotage sécurisé des volets.
