title: Lumières
path: lumieres
icon: mdi:lightbulb-group-outline
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Salon
        icon: mdi:sofa-outline
      - type: tile
        entity: input_boolean.kimia_lumiere_salon
        name: Éclairage salon (démo)
        icon: mdi:ceiling-light
  - type: grid
    cards:
      - type: heading
        heading: Cuisine et chambres
        icon: mdi:home-lightbulb-outline
      - type: tile
        entity: input_boolean.kimia_lumiere_cuisine
        name: Cuisine (démo)
        icon: mdi:lightbulb-outline
      - type: tile
        entity: input_boolean.kimia_lumiere_chambre
        name: Chambre (démo)
        icon: mdi:bed-outline
  - type: grid
    cards:
      - type: heading
        heading: Toute la maison
        icon: mdi:lightbulb-group-off-outline
      - type: button
        name: Tout éteindre
        icon: mdi:lightbulb-group-off-outline
        tap_action:
          action: perform-action
          perform_action: script.kimia_lumieres_eteindre
      - type: markdown
        content: >-
          **Éclairage LEDVANCE SMART+**

          Après intégration Zigbee, les vraies ampoules et spots remplaceront
          les commandes de démonstration. La variation et les couleurs
          seront proposées uniquement par les modèles compatibles.
