title: Lumières
path: lumieres
icon: mdi:lightbulb-group-outline
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        template: kimia_v2_tile
        name: Allumées
        icon: mdi:lightbulb-group
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('light.') && e.state==='on').length;
            return n+' actif'+(n>1?'s':'');
          ]]]
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:ceiling-light
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Cuisine
        icon: mdi:lightbulb-spot
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Entrée
        icon: mdi:wall-sconce-flat
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Terrasse
        icon: mdi:outdoor-lamp
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Parents
        icon: mdi:lamp
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre 1
        icon: mdi:lightbulb-outline
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre 2
        icon: mdi:lightbulb-outline
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre 3
        icon: mdi:lightbulb-outline
        label: À associer à un équipement
        tap_action:
          action: none
      - type: custom:button-card
        template: kimia_v08_scene
        entity: script.kimia_ambiance_detente
        name: Détente
        icon: mdi:sofa
        variables:
          couleur: "#25CBBB"
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_detente
      - type: custom:button-card
        template: kimia_v08_scene
        entity: script.kimia_ambiance_soiree
        name: Soirée
        icon: mdi:party-popper
        variables:
          couleur: "#F2B84D"
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_soiree
      - type: custom:button-card
        template: kimia_v08_scene
        entity: script.kimia_ambiance_cinema
        name: Cinéma
        icon: mdi:movie-open
        variables:
          couleur: "#B29EFF"
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_cinema
      - type: custom:navbar-card
        desktop:
          mode: docked
          position: left
          show_labels: false
          min_width: 768
        mobile:
          mode: docked
          show_labels: false
          safe_area: true
        layout:
          auto_padding:
            enabled: true
            desktop_px: 80
            mobile_px: 70
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home-variant
            label: Accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-group-outline
            label: Lumières
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - icon: mdi:dots-horizontal
            label: Plus
            hidden: |
              [[[ return navbar.isDesktop; ]]]
            tap_action:
              action: open-popup
            popup:
              - url: /kimia-smart/musique
                icon: mdi:music-note
                label: Musique
              - url: /kimia-smart/securite
                icon: mdi:shield-home-outline
                label: Sécurité
              - url: /kimia-smart/prises
                icon: mdi:power-socket-eu
                label: Prises
              - url: /kimia-smart/actualites
                icon: mdi:newspaper-variant-outline
                label: Actualités
              - url: /kimia-smart/parametres
                icon: mdi:cog-outline
                label: Réglages
