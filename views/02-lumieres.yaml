title: Lumières
path: lumieres
icon: mdi:lightbulb-group-outline
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Éclairage de la maison
        icon: mdi:lightbulb-group-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Allumées
        icon: mdi:lightbulb-group
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('light.') && e.state==='on').length;
            return n+' actif'+(n>1?'s':'');
          ]]]
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: markdown
        content: >-
          Touchez les commandes des lampes après leur association à Home Assistant. Les ampoules et spots retenus dans le catalogue sont **LEDVANCE SMART+ Zigbee**.
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 17px;
              background: var(--card-background-color);
              border: 1px solid var(--divider-color);
              color: var(--primary-text-color);
            }
  - type: grid
    cards:
      - type: heading
        heading: Pièces de vie
        icon: mdi:sofa-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:ceiling-light
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
