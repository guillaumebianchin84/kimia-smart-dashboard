title: Lumières
path: lumieres
icon: mdi:lightbulb-group-outline
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: markdown
        content: >-
          **Lumières allumées** : {{ states.light | selectattr('state', 'eq', 'on') | list | count }}
      - type: button
        name: "Salon"
        icon: mdi:ceiling-light
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Cuisine"
        icon: mdi:lightbulb-spot
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Entrée"
        icon: mdi:wall-sconce-flat
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Terrasse"
        icon: mdi:outdoor-lamp
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Parents"
        icon: mdi:lamp
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Chambre 1"
        icon: mdi:lightbulb-outline
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Chambre 2"
        icon: mdi:lightbulb-outline
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Chambre 3"
        icon: mdi:lightbulb-outline
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Détente"
        icon: mdi:sofa
        show_name: true
        show_icon: true
        show_state: false
        entity: script.kimia_ambiance_detente
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_detente
        hold_action:
          action: more-info
      - type: button
        name: "Soirée"
        icon: mdi:party-popper
        show_name: true
        show_icon: true
        show_state: false
        entity: script.kimia_ambiance_soiree
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_soiree
        hold_action:
          action: more-info
      - type: button
        name: "Cinéma"
        icon: mdi:movie-open
        show_name: true
        show_icon: true
        show_state: false
        entity: script.kimia_ambiance_cinema
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_cinema
        hold_action:
          action: more-info
      - type: custom:navbar-card
        desktop:
          mode: docked
          position: left
          show_labels: false
          min_width: 768
        mobile:
          mode: docked
          show_labels: false
          safe_area: true
        layout:
          auto_padding:
            enabled: true
            desktop_px: 80
            mobile_px: 70
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home-variant
            label: Accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-group-outline
            label: Lumières
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - icon: mdi:dots-horizontal
            label: Plus
            hidden: |
              [[[ return navbar.isDesktop; ]]]
            tap_action:
              action: open-popup
            popup:
              - url: /kimia-smart/musique
                icon: mdi:music-note
                label: Musique
              - url: /kimia-smart/securite
                icon: mdi:shield-home-outline
                label: Sécurité
              - url: /kimia-smart/prises
                icon: mdi:power-socket-eu
                label: Prises
              - url: /kimia-smart/actualites
                icon: mdi:newspaper-variant-outline
                label: Actualités
              - url: /kimia-smart/parametres
                icon: mdi:cog-outline
                label: Réglages
