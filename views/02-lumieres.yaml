title: Lumières
path: lumieres
icon: mdi:lightbulb-group-outline
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Éclairage de la maison
        icon: mdi:lightbulb-group-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Allumées
        icon: mdi:lightbulb-group
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('light.') && e.state==='on').length;
            return n+' actif'+(n>1?'s':'');
          ]]]
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: markdown
        content: >-
          Touchez les commandes des lampes après leur association à Home Assistant. Les ampoules et spots retenus dans le catalogue sont **LEDVANCE SMART+ Zigbee**.
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 17px;
              background: var(--card-background-color);
              border: 1px solid var(--divider-color);
              color: var(--primary-text-color);
            }
  - type: grid
    cards:
      - type: heading
        heading: Pièces de vie
        icon: mdi:sofa-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:ceiling-light
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Cuisine
        icon: mdi:lightbulb-spot
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Entrée
        icon: mdi:wall-sconce-flat
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Terrasse
        icon: mdi:outdoor-lamp
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
  - type: grid
    cards:
      - type: heading
        heading: Chambres
        icon: mdi:bed-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Parents
        icon: mdi:lamp
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre 1
        icon: mdi:lightbulb-outline
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre 2
        icon: mdi:lightbulb-outline
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre 3
        icon: mdi:lightbulb-outline
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Ambiances lumineuses
        icon: mdi:palette
        grid_options:
          columns: full
          rows: 1
      - type: markdown
        content: >-
          Scènes personnalisables pour chaque maison.
          Les boutons sont prêts ; ils n'activent aucun appareil
          tant que l'installateur n'a pas associé les scripts.
        grid_options:
          columns: full
          rows: auto
      - type: custom:button-card
        template: kimia_v08_scene
        entity: script.kimia_ambiance_detente
        name: Détente
        icon: mdi:sofa
        variables:
          couleur: "#25CBBB"
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_detente
        grid_options:
          columns: 4
          rows: 2
      - type: custom:button-card
        template: kimia_v08_scene
        entity: script.kimia_ambiance_soiree
        name: Soirée
        icon: mdi:party-popper
        variables:
          couleur: "#F2B84D"
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_soiree
        grid_options:
          columns: 4
          rows: 2
      - type: custom:button-card
        template: kimia_v08_scene
        entity: script.kimia_ambiance_cinema
        name: Cinéma
        icon: mdi:movie-open
        variables:
          couleur: "#B29EFF"
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.kimia_ambiance_cinema
        grid_options:
          columns: 4
          rows: 2
