title: Actualités
path: actualites
icon: mdi:newspaper-variant-outline
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:rss-news-card
        title: "Gabon Actu · GabonReview"
        sources:
          - entity: sensor.rss_gabon_actu
            name: Gabon Actu
            color: "#28C8AD"
          - entity: sensor.rss_gabonreview
            name: GabonReview
            color: "#50A7D8"
        max_articles: 8
        show_description: true
        show_source: true
        show_date: true
        image_width: 120
        image_height: 72
        card_mod:
          style: |
            ha-card {
              border: 1px solid rgba(49,190,186,.35);
              background: var(--card-background-color);
              border-radius: 21px;
              overflow: hidden;
            }
      - type: custom:rss-news-card
        title: "RFI Afrique · France 24"
        sources:
          - entity: sensor.rss_rfi_afrique
            name: RFI Afrique
            color: "#E7AD49"
          - entity: sensor.rss_france_24
            name: France 24
            color: "#528FD6"
        max_articles: 8
        show_description: true
        show_source: true
        show_date: true
        image_width: 120
        image_height: 72
        card_mod:
          style: |
            ha-card {
              border: 1px solid rgba(88,150,210,.35);
              background: var(--card-background-color);
              border-radius: 21px;
              overflow: hidden;
            }
      - type: custom:navbar-card
        desktop:
          mode: docked
          position: left
          show_labels: false
          min_width: 768
        mobile:
          mode: docked
          show_labels: false
          safe_area: true
        layout:
          auto_padding:
            enabled: true
            desktop_px: 80
            mobile_px: 70
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home-variant
            label: Accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-group-outline
            label: Lumières
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - icon: mdi:dots-horizontal
            label: Plus
            hidden: |
              [[[ return navbar.isDesktop; ]]]
            tap_action:
              action: open-popup
            popup:
              - url: /kimia-smart/musique
                icon: mdi:music-note
                label: Musique
              - url: /kimia-smart/securite
                icon: mdi:shield-home-outline
                label: Sécurité
              - url: /kimia-smart/prises
                icon: mdi:power-socket-eu
                label: Prises
              - url: /kimia-smart/actualites
                icon: mdi:newspaper-variant-outline
                label: Actualités
              - url: /kimia-smart/parametres
                icon: mdi:cog-outline
                label: Réglages
