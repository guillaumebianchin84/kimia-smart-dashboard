title: Actualités
path: actualites
icon: mdi:newspaper-variant-outline
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        grid_options:
          columns: full
          rows: auto
        tap_action:
          action: none
        custom_fields:
          logo: |
            [[[
              return '<div style="font-size:23px;font-weight:900;letter-spacing:-.8px;white-space:nowrap;">KIMIA <span style="color:#3FD6CB">Smart</span><div style="font-size:10px;letter-spacing:2px;font-weight:600;color:var(--secondary-text-color);margin-top:-2px">by PROMAINT</div></div>';
            ]]]
          slogan: |
            [[[
              return '<div style="font-size:20px;font-weight:800;letter-spacing:.2px;">Ma maison</div>';
            ]]]
          localisation: |
            [[[
              return '<div style="font-size:12px;font-weight:600;opacity:.8;">LIBREVILLE · GABON</div>';
            ]]]
        styles:
          card:
            - background: 'linear-gradient(105deg, rgba(12,137,147,.25), var(--card-background-color) 68%)'
            - border: '1px solid rgba(56,205,203,.28)'
            - border-radius: 18px
            - padding: 9px 18px
            - box-shadow: '0 5px 22px rgba(0,25,35,.12)'
          grid:
            - grid-template-areas: '"logo slogan localisation"'
            - grid-template-columns: '225px 1fr 150px'
            - grid-template-rows: auto
            - align-items: center
          custom_fields:
            logo:
              - text-align: left
              - justify-self: start
            slogan:
              - text-align: center
              - color: var(--primary-text-color)
            localisation:
              - text-align: right
              - justify-self: end
              - color: var(--secondary-text-color)
  - type: grid
    column_span: 2
    cards:
      - type: custom:rss-news-card
        title: "Gabon Actu"
        sources:
          - entity: sensor.rss_gabon_actu
            name: Gabon Actu
            color: "#28C8AD"
        max_articles: 5
        show_description: true
        show_source: true
        show_date: true
        image_width: 120
        image_height: 72
      - type: custom:rss-news-card
        title: "GabonReview"
        sources:
          - entity: sensor.rss_gabonreview
            name: GabonReview
            color: "#50A7D8"
        max_articles: 5
        show_description: true
        show_source: true
        show_date: true
        image_width: 120
        image_height: 72
      - type: custom:rss-news-card
        title: "RFI Afrique"
        sources:
          - entity: sensor.rss_rfi_afrique
            name: RFI Afrique
            color: "#E7AD49"
        max_articles: 5
        show_description: true
        show_source: true
        show_date: true
        image_width: 120
        image_height: 72
      - type: custom:rss-news-card
        title: "France 24"
        sources:
          - entity: sensor.rss_france_24
            name: France 24
            color: "#528FD6"
        max_articles: 5
        show_description: true
        show_source: true
        show_date: true
        image_width: 120
        image_height: 72
      - type: custom:navbar-card
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home
            label: Accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-on
            label: Lumières
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_lumieres"]?.state === "off"; ]]]
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_volets"]?.state === "off"; ]]]
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_climatisation"]?.state === "off"; ]]]
          - url: /kimia-smart/musique
            icon: mdi:music
            label: Musique
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_musique"]?.state === "off"; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_securite"]?.state === "off"; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_prises"]?.state === "off"; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_actualites"]?.state === "off"; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_parametres"]?.state === "off"; ]]]
        desktop:
          mode: floating
          position: left
          show_labels: never
