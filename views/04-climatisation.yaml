title: Climatisation
path: climatisation
icon: mdi:air-conditioner
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        template: kimia_v2_tile
        name: Température intérieure
        icon: mdi:home-thermometer-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Capteur à associer
      - type: custom:button-card
        template: kimia_v2_tile
        entity: weather.forecast_lbv
        name: Température extérieure · Libreville
        icon: mdi:weather-partly-cloudy
        tap_action:
          action: more-info
        grid_options:
          columns: 6
          rows: 1
        label: |
          [[[
            const t = entity?.attributes?.temperature;
            return t !== undefined && t !== null ? String(t).replace('.', ',') + ' °C' : 'Indisponible';
          ]]]
      - type: custom:button-card
        template: kimia_v2_tile
        name: Gestion automatique
        icon: mdi:autorenew
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: À configurer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Consigne maison
        icon: mdi:thermometer-lines
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: À configurer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:sofa-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Climatisation à associer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre
        icon: mdi:bed-king-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Climatisation à associer
      - type: custom:navbar-card
        grid_options:
          columns: 1
          rows: 1
        desktop:
          mode: docked
          position: left
          show_labels: false
          min_width: 768
        mobile:
          mode: docked
          show_labels: false
          safe_area: true
        layout:
          auto_padding:
            enabled: true
            desktop_px: 80
            mobile_px: 70
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home-variant
            label: Accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-group-outline
            label: Lumières
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - icon: mdi:dots-horizontal
            label: Plus
            hidden: |
              [[[ return navbar.isDesktop; ]]]
            tap_action:
              action: open-popup
            popup:
              - url: /kimia-smart/musique
                icon: mdi:music-note
                label: Musique
              - url: /kimia-smart/securite
                icon: mdi:shield-home-outline
                label: Sécurité
              - url: /kimia-smart/prises
                icon: mdi:power-socket-eu
                label: Prises
              - url: /kimia-smart/actualites
                icon: mdi:newspaper-variant-outline
                label: Actualités
              - url: /kimia-smart/parametres
                icon: mdi:cog-outline
                label: Réglages
