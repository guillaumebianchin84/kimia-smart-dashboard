title: Climatisation
path: climatisation
icon: mdi:air-conditioner
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Confort de la maison
        icon: mdi:home-thermometer-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Température intérieure
        icon: mdi:home-thermometer-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Capteur à associer
      - type: custom:button-card
        template: kimia_v2_tile
        entity: weather.forecast_lbv
        name: Température extérieure · Libreville
        icon: mdi:weather-partly-cloudy
        tap_action:
          action: more-info
        grid_options:
          columns: 6
          rows: 1
        label: |
          [[[
            const t = entity?.attributes?.temperature;
            return t !== undefined && t !== null ? String(t).replace('.', ',') + ' °C' : 'Indisponible';
          ]]]
      - type: custom:button-card
        template: kimia_v2_tile
        name: Gestion automatique
        icon: mdi:autorenew
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: À configurer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Consigne maison
        icon: mdi:thermometer-lines
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: À configurer
  - type: grid
    cards:
      - type: heading
        heading: Climatiseurs
        icon: mdi:air-conditioner
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:sofa-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Climatisation à associer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre
        icon: mdi:bed-king-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Climatisation à associer
      - type: markdown
        content: >-
          Ces emplacements sont inactifs jusqu'à l'association avec les vrais climatiseurs et capteurs du logement.
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 17px;
              background: var(--card-background-color);
              border: 1px solid var(--divider-color);
              color: var(--primary-text-color);
            }
      # Barre KIMIA flottante, identique sur les 9 vues.
      # Sa config et ses routes sont centralisées dans navbar-templates.
      - type: custom:navbar-card
        template: kimia_navigation
        grid_options:
          columns: full
          rows: 1
