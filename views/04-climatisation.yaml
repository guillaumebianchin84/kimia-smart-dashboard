title: Climatisation
path: climatisation
icon: mdi:air-conditioner
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Salon
        icon: mdi:thermometer
      - type: tile
        entity: input_number.kimia_consigne_salon
        name: Consigne salon (démo)
  - type: grid
    cards:
      - type: heading
        heading: Chambre
        icon: mdi:bed-king-outline
      - type: tile
        entity: input_number.kimia_consigne_chambre
        name: Consigne chambre (démo)
  - type: grid
    cards:
      - type: heading
        heading: Confort personnalisé
        icon: mdi:home-thermometer-outline
      - type: markdown
        content: >-
          La température, la consigne et les modes de chaque climatiseur
          seront visibles après la configuration des vraies entités
          **climate**.

          L'interface conserve les mêmes repères sur téléphone et tablette.
