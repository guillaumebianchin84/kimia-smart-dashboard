# KIMIA V0.9 — Maquette dans sa propre carte, sections natives Home Assistant.
# Aucun custom:layout-card n'est utilisé. Une carte par fonction.
# Géométrie Maquette et image conservées à l'identique de la V0.8.
title: Accueil
path: accueil
icon: mdi:home-variant
type: sections
max_columns: 3
sections:
  # Bandeau sur toute la largeur (identité KIMIA / titre / lieu).
  - type: grid
    column_span: 3
    cards:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        grid_options:
          columns: full
          rows: auto
        tap_action:
          action: none
        custom_fields:
          logo: |
            [[[
              return '<div style="font-size:23px;font-weight:900;letter-spacing:-.8px;white-space:nowrap;">KIMIA <span style="color:#3FD6CB">Smart</span><div style="font-size:10px;letter-spacing:2px;font-weight:600;color:var(--secondary-text-color);margin-top:-2px">by PROMAINT</div></div>';
            ]]]
          slogan: |
            [[[
              return '<div style="font-size:20px;font-weight:800;letter-spacing:.2px;">Ma maison</div>';
            ]]]
          localisation: |
            [[[
              return '<div style="font-size:12px;font-weight:600;opacity:.8;">LIBREVILLE · GABON</div>';
            ]]]
        styles:
          card:
            - background: 'linear-gradient(105deg, rgba(12,137,147,.25), var(--card-background-color) 68%)'
            - border: '1px solid rgba(56,205,203,.28)'
            - border-radius: 18px
            - padding: 9px 18px
            - box-shadow: '0 5px 22px rgba(0,25,35,.12)'
          grid:
            - grid-template-areas: '"logo slogan localisation"'
            - grid-template-columns: '225px 1fr 150px'
            - grid-template-rows: auto
            - align-items: center
          custom_fields:
            logo:
              - text-align: left
              - justify-self: start
            slogan:
              - text-align: center
              - color: var(--primary-text-color)
            localisation:
              - text-align: right
              - justify-self: end
              - color: var(--secondary-text-color)

  # Plan principal : une carte Maquette classique intégrée à une section.
  - type: grid
    column_span: 2
    cards:
      - type: custom:maquette-card
        grid_options:
          columns: full
          rows: auto
        id: kimia_plan_accueil_v08
        title: ""
        language: fr
        full_page: false
        margin: 10
        summary: false
        legend: false
        room_labels:
          name: true
          temperature: false
          humidity: false
        temperature_tint: false
        ambience:
          day_night:
            sun: sun.sun
            intensity: 0.95
            marker: false
          weather:
            entity: weather.forecast_lbv
            intensity: 0.7
            direction: wind
        floors:
          - id: rdc
            name: Rez-de-chaussée
            short: RDC
            rooms:
              - name: Salon / Séjour
                poly: [[40, 80], [905, 80], [905, 560], [40, 560]]
                label: [470, 320]
              - name: Cuisine
                poly: [[905, 80], [1455, 80], [1455, 500], [905, 500]]
                label: [1180, 250]
              - name: Chambre 1
                poly: [[40, 560], [490, 560], [490, 1040], [40, 1040]]
                label: [265, 805]
              - name: Chambre 2
                poly: [[490, 560], [905, 560], [905, 1040], [490, 1040]]
                label: [700, 805]
              - name: Terrasse
                poly: [[905, 500], [1455, 500], [1455, 1040], [905, 1040]]
                label: [1180, 780]
                outside: true
                temperature: weather.forecast_lbv
                temperature_attribute: temperature
                humidity: weather.forecast_lbv
                humidity_attribute: humidity
            walls:
              - [40, 80, 1455, 80]
              - [1455, 80, 1455, 1040]
              - [1455, 1040, 40, 1040]
              - [40, 1040, 40, 80]
              - [905, 80, 905, 1040]
              - [40, 560, 905, 560]
              - [490, 560, 490, 1040]
              - [905, 500, 1455, 500]
            openings:
              # Toutes les ouvertures sont purement décoratives, sans capteurs / volets.
              - type: door
                name: Porte d'entrée
                seg: [40, 340, 40, 440]
                leaves: 1
                swing: right
                outside: [-1, 0]
                tap: none
              - type: door
                name: Passage cuisine
                seg: [905, 260, 905, 350]
                leaves: 1
                swing: left
                tap: none
              - type: door
                name: Porte chambre 1
                seg: [365, 560, 455, 560]
                leaves: 1
                swing: right
                tap: none
              - type: door
                name: Porte chambre 2
                seg: [610, 560, 700, 560]
                leaves: 1
                swing: left
                tap: none
              - type: door
                name: Baie vitrée terrasse
                seg: [1090, 500, 1350, 500]
                leaves: 2
                swing: sliding
                glazed: full
                sill: 0
                height: 220
                outside: [0, 1]
                tap: none
              - type: window
                name: Grande fenêtre séjour
                seg: [175, 80, 430, 80]
                leaves: 2
                swing: sliding
                outside: [0, -1]
                sill: 90
                height: 220
                tap: none
              - type: window
                name: Fenêtre latérale séjour
                seg: [40, 150, 40, 265]
                outside: [-1, 0]
                tap: none
              - type: window
                name: Fenêtre cuisine
                seg: [1090, 80, 1320, 80]
                leaves: 2
                swing: sliding
                outside: [0, -1]
                tap: none
              - type: window
                name: Fenêtre chambre 1
                seg: [135, 1040, 355, 1040]
                leaves: 2
                swing: sliding
                outside: [0, 1]
                tap: none
              - type: window
                name: Fenêtre chambre 2
                seg: [595, 1040, 805, 1040]
                leaves: 2
                swing: sliding
                outside: [0, 1]
                tap: none
            badges:
              # Six lampes symboliques ; aucun light.*, pas de commande.
              - name: Plafonnier séjour
                pos: [550, 185]
                icon: mdi:ceiling-light
                color: "#FFD166"
                tap: none
              - name: Lampe salon
                pos: [250, 435]
                icon: mdi:floor-lamp
                color: "#FFC857"
                tap: none
              - name: Éclairage cuisine
                pos: [1190, 340]
                icon: mdi:ceiling-light
                color: "#FFD166"
                tap: none
              - name: Lampe chambre 1
                pos: [375, 625]
                icon: mdi:lamp
                color: "#FFD166"
                tap: none
              - name: Lampe chambre 2
                pos: [790, 625]
                icon: mdi:lamp
                color: "#FFD166"
                tap: none
              - name: Éclairage terrasse
                pos: [1300, 850]
                icon: mdi:outdoor-lamp
                color: "#FFC857"
                tap: none
            furniture: []
            background:
              image: /api/image/serve/ff117c7cfa8067ef6fc7005b20d1d041/original
              pos: [0, 0]
              width: 1499
              height: 1049
              rotation: 0
              opacity: 1
              room_opacity: 0.18
              show: always

  # Trois cartes indépendantes, faciles à modifier dans l'interface HA.
  - type: grid
    column_span: 1
    cards:
      - type: custom:clock-weather-card
        grid_options:
          columns: full
          rows: auto
        entity: weather.forecast_lbv
        title: Libreville
        weather_icon_type: fill
        animated_icon: true
        forecast_rows: 4
        locale: fr
        hide_clock: true
        hide_date: true
        show_humidity: true
        hourly_forecast: false
        card_mod:
          style: |
            ha-card {
              border-radius: 20px !important;
              background: linear-gradient(145deg, rgba(26,109,143,.30), var(--card-background-color) 74%) !important;
              border: 1px solid rgba(91,187,230,.38);
              box-shadow: 0 6px 20px rgba(3,37,57,.15);
              overflow: hidden;
            }

      # Scénarios rapides avec véritables boutons ; raccordement par package.
      - type: grid
        grid_options:
          columns: full
          rows: auto
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: kimia_v08_scene
            entity: script.kimia_au_lit
            name: Au lit
            icon: mdi:weather-night
            variables:
              couleur: '#B6ACFF'
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.kimia_au_lit
          - type: custom:button-card
            template: kimia_v08_scene
            entity: script.kimia_depart
            name: Départ
            icon: mdi:door-open
            variables:
              couleur: '#4FE39B'
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.kimia_depart
          - type: custom:button-card
            template: kimia_v08_scene
            entity: script.kimia_retour
            name: Retour
            icon: mdi:home-import-outline
            variables:
              couleur: '#4BCBFF'
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.kimia_retour
          - type: custom:button-card
            template: kimia_v08_scene
            entity: script.kimia_reveil
            name: Réveil
            icon: mdi:weather-sunny
            variables:
              couleur: '#FFCE56'
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.kimia_reveil

      # RSS réels, sans dépendre des sensor.kimia_flash_*.
      - type: custom:rss-news-card
        grid_options:
          columns: full
          rows: auto
        title: "🇬🇦 L'essentiel au Gabon"
        sources:
          - entity: sensor.rss_gabon_actu
            name: Gabon Actu
            color: '#33CDB7'
          - entity: sensor.rss_gabonreview
            name: GabonReview
            color: '#6AAEDC'
        max_articles: 3
        card_height: 145
        show_description: false
        show_source: true
        show_date: false
        image_width: 76
        image_height: 56
        card_mod:
          style: |
            ha-card {
              border-radius: 18px !important;
              border: 1px solid rgba(53,205,184,.32);
              background: var(--card-background-color);
              overflow: hidden;
            }
