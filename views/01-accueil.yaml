title: Accueil
path: accueil
icon: mdi:home-variant-outline
type: sections
max_columns: 2
sections:
  # 01 — Bandeau compact, environ deux fois moins haut que le premier test.
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        section_mode: true
        grid_options:
          columns: full
          rows: auto
        show_icon: false
        show_name: false
        show_label: false
        tap_action:
          action: none
        triggers_update: []
        custom_fields:
          brand: |
            [[[
              return `<div style="font-size:22px;font-weight:850;line-height:1.1;letter-spacing:-.7px">KIMIA<span style="color:#43D9CE"> Smart</span></div>
              <div style="font-size:9px;font-weight:750;color:#C3E0E8;letter-spacing:2px;margin-top:4px">BY PROMAINT</div>`;
            ]]]
          hello: |
            [[[
              const h = new Date().getHours();
              const salutation = h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
              return `<div style="font-size:11px;color:#D7EDF3;text-align:right">${salutation}<br/>Votre maison, tout simplement.</div>`;
            ]]]
        styles:
          card:
            - background: 'linear-gradient(117deg, #0D324F 0%, #15597B 65%, #137D87 100%)'
            - border: '1px solid rgba(255,255,255,.12)'
            - border-radius: 19px
            - padding: 14px 16px
            - color: '#FFFFFF'
            - box-shadow: '0 5px 16px rgba(0,45,68,.13)'
          grid:
            - grid-template-areas: '"brand hello"'
            - grid-template-columns: minmax(0,1fr) auto
            - grid-template-rows: auto
            - align-items: center
            - column-gap: 8px
          custom_fields:
            brand:
              - justify-self: start
              - text-align: left
            hello:
              - justify-self: end
              - text-align: right

  # 02 — Météo Libreville. La localisation et les capteurs sont adaptés au client.
      - type: heading
        heading: Météo · Libreville
        icon: mdi:weather-partly-cloudy
        visibility:
          - condition: state
            entity: input_select.kimia_meteo_visible
            state: "Oui"
        grid_options:
          columns: full
          rows: 1
      - type: weather-forecast
        entity: weather.forecast_lbv
        visibility:
          - condition: state
            entity: input_select.kimia_meteo_visible
            state: "Oui"
        forecast_type: daily
        show_current: true
        show_forecast: true
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              overflow: hidden;
              background: var(--card-background-color);
              color: var(--primary-text-color);
              border: 1px solid var(--divider-color);
              box-shadow: 0 3px 12px rgba(0,30,53,.05);
            }
      - type: custom:button-card
        template: kimia_v2_tile
        name: Température intérieure
        icon: mdi:home-thermometer-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Capteur à associer
      - type: custom:button-card
        template: kimia_v2_tile
        entity: weather.forecast_lbv
        name: Température extérieure · Libreville
        icon: mdi:weather-partly-cloudy
        tap_action:
          action: more-info
        grid_options:
          columns: 6
          rows: 1
        label: |
          [[[
            const t = entity?.attributes?.temperature;
            return t !== undefined && t !== null ? String(t).replace('.', ',') + ' °C' : 'Indisponible';
          ]]]
      - type: heading
        heading: Ma maison
        icon: mdi:home-heart
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Présence
        icon: mdi:home-account
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Mode à configurer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Lumières
        icon: mdi:lightbulb-group-outline
        grid_options:
          columns: 6
          rows: 1
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('light.') && e.state==='on').length;
            return n+' allumée'+(n>1?'s':'');
          ]]]
      - type: custom:button-card
        template: kimia_v2_tile
        name: Volets
        icon: mdi:window-shutter
        grid_options:
          columns: 6
          rows: 1
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('cover.') && e.state==='open').length;
            return n+' ouvert'+(n>1?'s':'');
          ]]]
      - type: custom:button-card
        template: kimia_v2_tile
        name: Gestion automatique
        icon: mdi:autorenew
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: À configurer
      - type: heading
        heading: Confort
        icon: mdi:thermostat
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:sofa-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Climatisation à associer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre
        icon: mdi:bed-king-outline
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
        label: Climatisation à associer
      - type: custom:button-card
        template: kimia_v2_tile
        name: Consigne maison
        icon: mdi:thermometer-lines
        tap_action:
          action: none
        grid_options:
          columns: 12
          rows: 1
        label: À configurer
  # 04 — Sources RSS de la VM KIMIA : Gabon, Afrique et Monde.
      - type: heading
        heading: Le journal
        icon: mdi:newspaper-variant-outline
        visibility:
          - condition: state
            entity: input_select.kimia_journal_visible
            state: "Oui"
        grid_options:
          columns: full
          rows: 1
      - type: custom:rss-news-card
        visibility:
          - condition: state
            entity: input_select.kimia_journal_visible
            state: "Oui"
        title: 📰 Gabon · Afrique · Monde
        sources:
          - entity: sensor.rss_gabon_actu
            name: Gabon Actu
            color: '#00A879'
          - entity: sensor.rss_gabonreview
            name: GabonReview
            color: '#3797C6'
          - entity: sensor.rss_rfi_afrique
            name: RFI Afrique
            color: '#F39836'
          - entity: sensor.rss_france_24
            name: France 24
            color: '#2377C4'
        max_articles: 5
        card_height: 265
        show_description: false
        show_source: true
        show_date: true
        image_width: 120
        image_height: 68
        grid_options:
          columns: full
          rows: 5
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              overflow: hidden;
              background: var(--card-background-color);
              border: 1px solid var(--divider-color);
              box-shadow: 0 3px 12px rgba(0,30,53,.05);
            }