title: Accueil
path: accueil
icon: mdi:home-outline
type: sections
max_columns: 3
header:
  layout: responsive
  badges_position: bottom
  card:
    type: markdown
    content: >-
      <table role="presentation"><tr>
      <td width="160"><img src="/local/kimia-logo.svg" width="144" height="42" alt="KIMIA Smart by PROMAINT"/></td>
      <td><strong>{% if now().hour < 12 %}Bonjour{% elif now().hour < 18 %}Bon après-midi{% else %}Bonsoir{% endif %} {{ user }}</strong>
      <br/>Votre maison, tout simplement.
      <br/><small>{{ now().strftime('%d/%m/%Y') }}</small></td>
      </tr></table>
sections:
  - type: grid
    cards:
      - type: heading
        heading: Aujourd'hui
        icon: mdi:weather-partly-cloudy
      - type: markdown
        content: >-
          {% set meteo = states('weather.forecast_home') %}
          {% set t = state_attr('weather.forecast_home','temperature') %}
          {% if meteo not in ['unknown','unavailable','none'] %}
          ### {{ '🌤️' if meteo in ['sunny','partlycloudy'] else '🌧️' if meteo in ['rainy','pouring'] else '🌥️' }} {{ meteo | replace('-',' ') | capitalize }}

          **{{ t ~ ' °C' if t is not none else 'Météo disponible' }}**
          {% else %}
          ### 🌤️ La météo de votre maison

          Sera affichée après l'ajout de votre service météo.
          {% endif %}
      - type: heading
        heading: Le journal
        icon: mdi:newspaper-variant-outline
      - type: markdown
        content: >-
          {% set titres = [
            states('input_text.kimia_actu_1'),
            states('input_text.kimia_actu_2'),
            states('input_text.kimia_actu_3')
          ] %}
          {% set titres_valides = titres | reject('in', ['unknown','unavailable','none','']) | list %}
          {% if titres_valides %}
          {% for titre in titres_valides %}
          - {{ titre }}
          {% endfor %}
          {% else %}
          *Le journal sera disponible après la configuration d'un flux RSS.*
          {% endif %}
      - type: markdown
        content: >-
          {% set brief = states('input_text.kimia_brief') %}
          {% if brief not in ['unknown','unavailable','none',''] %}
          **En bref**

          {{ brief }}
          {% endif %}
  - type: grid
    cards:
      - type: heading
        heading: Scénarios rapides
        icon: mdi:gesture-tap-button
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Bonjour
            icon: mdi:weather-sunset-up
            tap_action:
              action: perform-action
              perform_action: script.kimia_bonjour
          - type: button
            name: Départ
            icon: mdi:home-export-outline
            tap_action:
              action: perform-action
              perform_action: script.kimia_depart
          - type: button
            name: Détente
            icon: mdi:sofa-outline
            tap_action:
              action: perform-action
              perform_action: script.kimia_detente
          - type: button
            name: Bonne nuit
            icon: mdi:weather-night
            tap_action:
              action: perform-action
              perform_action: script.kimia_bonne_nuit
      - type: heading
        heading: État de la maison
        icon: mdi:home-analytics
      - type: markdown
        content: >-
          {% set lampes = ['input_boolean.kimia_lumiere_salon',
                           'input_boolean.kimia_lumiere_cuisine',
                           'input_boolean.kimia_lumiere_chambre'] %}
          {% set ns = namespace(n=0) %}
          {% for lampe in lampes %}{% if is_state(lampe, 'on') %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
          **{{ '🚶 Mode absence' if is_state('input_boolean.kimia_mode_absence','on') else '🏡 Maison occupée' }}**

          💡 {{ ns.n }} lumière(s) allumée(s)

          🚪 {{ 'Porte ouverte' if is_state('input_boolean.kimia_porte_ouverte','on') else 'Porte fermée' }}
      - type: tile
        entity: input_boolean.kimia_mode_absence
        name: Mode absence (démo)
      - type: tile
        entity: input_number.kimia_consigne_salon
        name: Consigne salon (démo)
  - type: grid
    cards:
      - type: heading
        heading: Accès rapides
        icon: mdi:view-dashboard-outline
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Lumières
            icon: mdi:lightbulb-group-outline
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/lumieres
          - type: button
            name: Volets
            icon: mdi:window-shutter
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/volets
          - type: button
            name: Climatisation
            icon: mdi:air-conditioner
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/climatisation
          - type: button
            name: Musique
            icon: mdi:music
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/musique
          - type: button
            name: Prises
            icon: mdi:power-socket-eu
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/prises
          - type: button
            name: Sécurité
            icon: mdi:shield-home-outline
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/securite
      - type: heading
        heading: À retenir
        icon: mdi:shield-check-outline
      - type: markdown
        content: >-
          La domotique locale continue à fonctionner sans Internet.

          Les fonctions Google, les actualités et l'accès distant
          dépendent de la connexion.
