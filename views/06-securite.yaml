title: Sécurité
path: securite
icon: mdi:shield-home-outline
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        template: kimia_v2_tile
        name: Ouvertures actives
        icon: mdi:door-open
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('binary_sensor.') && ['door','window','opening'].includes(e.attributes?.device_class) && e.state==='on').length;
            return n+' actif'+(n>1?'s':'');
          ]]]
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Mouvements actifs
        icon: mdi:motion-sensor
        triggers_update: all
        label: |
          [[[
            const n=Object.values(states).filter(e=>e.entity_id?.startsWith('binary_sensor.') && ['motion','occupancy','presence'].includes(e.attributes?.device_class) && e.state==='on').length;
            return n+' actif'+(n>1?'s':'');
          ]]]
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Porte d'entrée
        icon: mdi:door-closed
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Fenêtre salon
        icon: mdi:window-closed
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Fenêtre chambre
        icon: mdi:window-closed
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Détecteur d'eau
        icon: mdi:water-alert
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Entrée
        icon: mdi:cctv
        label: Caméra à associer
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Extérieur
        icon: mdi:cctv
        label: Caméra à associer
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:navbar-card
        grid_options:
          columns: 1
          rows: 1
        desktop:
          mode: docked
          position: left
          show_labels: false
          min_width: 768
        mobile:
          mode: docked
          show_labels: false
          safe_area: true
        layout:
          auto_padding:
            enabled: true
            desktop_px: 80
            mobile_px: 70
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home-variant
            label: Accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-group-outline
            label: Lumières
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            hidden: |
              [[[ return !navbar.isDesktop; ]]]
          - icon: mdi:dots-horizontal
            label: Plus
            hidden: |
              [[[ return navbar.isDesktop; ]]]
            tap_action:
              action: open-popup
            popup:
              - url: /kimia-smart/musique
                icon: mdi:music-note
                label: Musique
              - url: /kimia-smart/securite
                icon: mdi:shield-home-outline
                label: Sécurité
              - url: /kimia-smart/prises
                icon: mdi:power-socket-eu
                label: Prises
              - url: /kimia-smart/actualites
                icon: mdi:newspaper-variant-outline
                label: Actualités
              - url: /kimia-smart/parametres
                icon: mdi:cog-outline
                label: Réglages
