title: Sécurité
path: securite
icon: mdi:shield-home-outline
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        grid_options:
          columns: full
          rows: auto
        tap_action:
          action: none
        custom_fields:
          logo: |
            [[[
              return '<div style="font-size:23px;font-weight:900;letter-spacing:-.8px;white-space:nowrap;">KIMIA <span style="color:#3FD6CB">Smart</span><div style="font-size:10px;letter-spacing:2px;font-weight:600;color:var(--secondary-text-color);margin-top:-2px">by PROMAINT</div></div>';
            ]]]
          slogan: |
            [[[
              return '<div style="font-size:20px;font-weight:800;letter-spacing:.2px;">Ma maison</div>';
            ]]]
          localisation: |
            [[[
              return '<div style="font-size:12px;font-weight:600;opacity:.8;">LIBREVILLE · GABON</div>';
            ]]]
        styles:
          card:
            - background: 'linear-gradient(105deg, rgba(12,137,147,.25), var(--card-background-color) 68%)'
            - border: '1px solid rgba(56,205,203,.28)'
            - border-radius: 18px
            - padding: 9px 18px
            - box-shadow: '0 5px 22px rgba(0,25,35,.12)'
          grid:
            - grid-template-areas: '"logo slogan localisation"'
            - grid-template-columns: '225px 1fr 150px'
            - grid-template-rows: auto
            - align-items: center
          custom_fields:
            logo:
              - text-align: left
              - justify-self: start
            slogan:
              - text-align: center
              - color: var(--primary-text-color)
            localisation:
              - text-align: right
              - justify-self: end
              - color: var(--secondary-text-color)
  - type: grid
    column_span: 2
    cards:
      - type: markdown
        content: >-
          **Ouvertures détectées** : {{ states.binary_sensor | selectattr('state', 'eq', 'on') | selectattr('attributes.device_class', 'in', ['door', 'window', 'opening']) | list | count }}
      - type: markdown
        content: >-
          **Mouvements détectés** : {{ states.binary_sensor | selectattr('state', 'eq', 'on') | selectattr('attributes.device_class', 'in', ['motion', 'occupancy', 'presence']) | list | count }}
      - type: button
        name: "Porte d'entrée"
        icon: mdi:door-closed
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Fenêtre salon"
        icon: mdi:window-closed
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Fenêtre chambre"
        icon: mdi:window-closed
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Détecteur d'eau"
        icon: mdi:water-alert
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Entrée"
        icon: mdi:cctv
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: button
        name: "Extérieur"
        icon: mdi:cctv
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: custom:navbar-card
        desktop:
          mode: docked
          position: left
          show_labels: false
          min_width: 768
        mobile:
          mode: docked
          show_labels: false
          safe_area: true
        layout:
          auto_padding:
            enabled: true
            desktop_px: 80
            mobile_px: 70
        routes:
          - url: /kimia-smart/accueil
            icon: mdi:home-variant
            label: Accueil
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/accueil
          - url: /kimia-smart/lumieres
            icon: mdi:lightbulb-group-outline
            label: Lumières
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/lumieres
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_lumieres"]?.state === "off"; ]]]
          - url: /kimia-smart/volets
            icon: mdi:window-shutter
            label: Volets
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/volets
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_volets"]?.state === "off"; ]]]
          - url: /kimia-smart/climatisation
            icon: mdi:air-conditioner
            label: Clim
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/climatisation
            hidden: |
              [[[ return states["input_boolean.kimia_onglet_climatisation"]?.state === "off"; ]]]
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/musique
            hidden: |
              [[[ return !navbar.isDesktop || states["input_boolean.kimia_onglet_musique"]?.state === "off"; ]]]
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/securite
            hidden: |
              [[[ return !navbar.isDesktop || states["input_boolean.kimia_onglet_securite"]?.state === "off"; ]]]
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/prises
            hidden: |
              [[[ return !navbar.isDesktop || states["input_boolean.kimia_onglet_prises"]?.state === "off"; ]]]
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/actualites
            hidden: |
              [[[ return !navbar.isDesktop || states["input_boolean.kimia_onglet_actualites"]?.state === "off"; ]]]
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Réglages
            tap_action:
              action: navigate
              navigation_path: /kimia-smart/parametres
            hidden: |
              [[[ return !navbar.isDesktop || states["input_boolean.kimia_onglet_parametres"]?.state === "off"; ]]]
          - icon: mdi:dots-horizontal
            label: Plus
            hidden: |
              [[[
                return navbar.isDesktop || ![
                  "input_boolean.kimia_onglet_musique",
                  "input_boolean.kimia_onglet_securite",
                  "input_boolean.kimia_onglet_prises",
                  "input_boolean.kimia_onglet_actualites",
                  "input_boolean.kimia_onglet_parametres"
                ].some(id => states[id]?.state !== "off");
              ]]]
            tap_action:
              action: open-popup
            popup: |
              [[[
                return [
                  { url: "/kimia-smart/musique", icon: "mdi:music-note", label: "Musique", tap_action: { action: "navigate", navigation_path: "/kimia-smart/musique" }, helper: "input_boolean.kimia_onglet_musique" },
                  { url: "/kimia-smart/securite", icon: "mdi:shield-home-outline", label: "Sécurité", tap_action: { action: "navigate", navigation_path: "/kimia-smart/securite" }, helper: "input_boolean.kimia_onglet_securite" },
                  { url: "/kimia-smart/prises", icon: "mdi:power-socket-eu", label: "Prises", tap_action: { action: "navigate", navigation_path: "/kimia-smart/prises" }, helper: "input_boolean.kimia_onglet_prises" },
                  { url: "/kimia-smart/actualites", icon: "mdi:newspaper-variant-outline", label: "Actualités", tap_action: { action: "navigate", navigation_path: "/kimia-smart/actualites" }, helper: "input_boolean.kimia_onglet_actualites" },
                  { url: "/kimia-smart/parametres", icon: "mdi:cog-outline", label: "Réglages", tap_action: { action: "navigate", navigation_path: "/kimia-smart/parametres" }, helper: "input_boolean.kimia_onglet_parametres" }
                ]
                  .filter(item => hass.states[item.helper]?.state !== "off")
                  .map(({helper, ...route}) => route);
              ]]]
