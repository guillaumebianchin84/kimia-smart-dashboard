title: Musique
path: musique
icon: mdi:music
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Enceintes Google
        icon: mdi:cast-audio
      - type: markdown
        content: >-
          **Choisir une enceinte**

          Lorsque Google Cast sera configuré, cette page affichera les
          lecteurs et commandes de volume de la maison.

          La lecture native sur les enceintes ne nécessite pas d'IA dans Home Assistant.
  - type: grid
    cards:
      - type: heading
        heading: Ma musique locale
        icon: mdi:folder-music-outline
      - type: markdown
        content: >-
          📁 Réveil doux

          📁 Louanges

          📁 Musique gabonaise

          📁 Soirée

          Le client pourra enrichir ses dossiers MP3 depuis le réseau local.
      - type: button
        name: Réveil musical (simulation)
        icon: mdi:alarm
        tap_action:
          action: perform-action
          perform_action: script.kimia_reveil_musical
  - type: grid
    cards:
      - type: heading
        heading: Les trois usages
        icon: mdi:speaker-wireless
      - type: markdown
        content: >-
          **Google / Gemini** : conversation et musique en ligne.

          **Google Cast** : lecture des MP3 depuis Home Assistant.

          **Bluetooth** : musique envoyée depuis le téléphone du client.

          La bibliothèque MP3 et la reprise Cast/Bluetooth restent à tester.
