title: Musique
path: musique
icon: mdi:music
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Enceintes et diffusion
        icon: mdi:cast-audio
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Salon
        icon: mdi:speaker-wireless
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Cuisine
        icon: mdi:speaker-wireless
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Chambre parents
        icon: mdi:speaker-wireless
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Autre enceinte
        icon: mdi:speaker-wireless
        label: À associer à un équipement
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: markdown
        content: >-
          Google Cast et le Bluetooth seront proposés selon les modèles et la connexion. Les lecteurs devront être détectés dans Home Assistant avant leur configuration.
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 17px;
              background: var(--card-background-color);
              border: 1px solid var(--divider-color);
              color: var(--primary-text-color);
            }
  - type: grid
    cards:
      - type: heading
        heading: Musique locale
        icon: mdi:folder-music-outline
        grid_options:
          columns: full
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Réveil doux
        icon: mdi:weather-sunset-up
        label: Lecture MP3 à configurer
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Louanges
        icon: mdi:music-note
        label: Lecture MP3 à configurer
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        template: kimia_v2_tile
        name: Musique personnelle
        icon: mdi:playlist-music
        label: Lecture MP3 à configurer
        tap_action:
          action: none
        grid_options:
          columns: 6
          rows: 1
      - type: markdown
        content: >-
          Les MP3 seront conservés dans les dossiers du client. Aucun abonnement Music Assistant n'est prévu comme obligation.
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 17px;
              background: var(--card-background-color);
              border: 1px solid var(--divider-color);
              color: var(--primary-text-color);
            }
      # Barre KIMIA flottante, identique sur les 9 vues.
      # Sa config et ses routes sont centralisées dans navbar-templates.
      - type: custom:navbar-card
        template: kimia_navigation
        grid_options:
          columns: full
          rows: 1
