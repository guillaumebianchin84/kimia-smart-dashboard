# Thème KIMIA. Modes clair/sombre identiques pour garantir la lisibilité
# si le téléphone change son apparence système.
KIMIA Gris Premium:
  modes:
    light:
      primary-background-color: "#25282E"
      secondary-background-color: "#2B3038"
      card-background-color: "#353D46"
      primary-text-color: "#F4F7FA"
      secondary-text-color: "#C2CDD6"
      primary-color: "#5AD4D0"
      accent-color: "#36C8BE"
      app-header-background-color: "#24272B"
      app-header-text-color: "#F4F7FA"
      sidebar-background-color: "#2A2E35"
      sidebar-text-color: "#F4F7FA"
      state-icon-color: "#91CFCF"
      state-icon-active-color: "#39D9CF"
      ha-card-border-color: "#52606C"
      ha-card-border-radius: "18px"
      ha-card-box-shadow: "0 3px 12px rgba(0,0,0,0.16)"
    dark:
      primary-background-color: "#25282E"
      secondary-background-color: "#2B3038"
      card-background-color: "#353D46"
      primary-text-color: "#F4F7FA"
      secondary-text-color: "#C2CDD6"
      primary-color: "#5AD4D0"
      accent-color: "#36C8BE"
      app-header-background-color: "#24272B"
      app-header-text-color: "#F4F7FA"
      sidebar-background-color: "#2A2E35"
      sidebar-text-color: "#F4F7FA"
      state-icon-color: "#91CFCF"
      state-icon-active-color: "#39D9CF"
      ha-card-border-color: "#52606C"
      ha-card-border-radius: "18px"
      ha-card-box-shadow: "0 3px 12px rgba(0,0,0,0.16)"
