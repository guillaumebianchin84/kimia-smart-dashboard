# KIMIA Smart — KIMIA Terracotta.
# Teintes adaptées au mode natif Home Assistant et aux menus déroulants.
KIMIA Terracotta:
  modes:
    dark:
      primary-background-color: "#221715"
      secondary-background-color: "#34221E"
      card-background-color: "#45312D"
      primary-text-color: "#FFF3EB"
      secondary-text-color: "#DEC4B8"
      primary-color: "#EAA489"
      accent-color: "#ED8C66"
      app-header-background-color: "#301D1A"
