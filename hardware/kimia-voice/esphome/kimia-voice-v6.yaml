# KIMIA Voice V6 - ESP32-S3 N16R8 externe + XVF3800
# Configuration de preparation (non flashee / non validee au banc).
# Conserver cette configuration separee de l'Ikabot en service.
#
# Copier CE fichier et hardware-kimia-v6.yaml dans le meme dossier ESPHome.
# Ajouter secrets.yaml dans ce dossier avec :
#   wifi_ssid, wifi_password, api_key, ota_password
#
# Brochage XVF3800:
# GPIO1  : DATA1 -> micro ESP32 (I2S DIN)
# GPIO2  : DATA0/DATAQ <- audio ESP32 (I2S DOUT)
# GPIO5  : I2C SDA (bus partage avec BME280 et tactile si compatibles)
# GPIO6  : I2C SCL
# GPIO7  : I2S LRCK
# GPIO8  : I2S BCLK
# GPIO43/44 : RESERVES UART0 / CH343P ; NE PAS utiliser pour I2S KIMIA.
#
# Ne pas alimenter la carte en 5V externe en meme temps que l'USB-C :
# pont IN-OUT soude sur cette carte.
#
substitutions:
  name: kimia-voice-v6
  friendly_name: KIMIA Voice V6
  respeaker_ref: main

packages:
  # Reprise des fonctions ESPHome qui fonctionnent sur le Respeaker Ikabot.
  # On exclut intentionnellement packages/hardware.yaml (GPIO43/GPIO44).
  core:
    url: https://github.com/guillaumebianchin84/Respeakerikabot-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml
  hardware_kimia: !include hardware-kimia-v6.yaml

esp32:
  # La carte externe N16R8 est equipee de 16 Mo de flash et 8 Mo de PSRAM.
  flash_size: 16MB

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
