title: KIMIA Administration
views:
  - title: Navigation
    path: navigation
    icon: mdi:shield-cog
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "KIMIA · Administration"
            icon: mdi:shield-cog-outline
          - type: markdown
            content: >-
              **Navigation de la maison** — activez les onglets que vous
              souhaitez afficher aux habitants. L'Accueil reste toujours
              visible. Les choix sont conservés après redémarrage.
          - type: markdown
            content: |
              **Onglets visibles :** {{ expand([
                'input_boolean.kimia_onglet_lumieres',
                'input_boolean.kimia_onglet_volets',
                'input_boolean.kimia_onglet_climatisation',
                'input_boolean.kimia_onglet_musique',
                'input_boolean.kimia_onglet_securite',
                'input_boolean.kimia_onglet_prises',
                'input_boolean.kimia_onglet_actualites',
                'input_boolean.kimia_onglet_parametres'
              ]) | selectattr('state', 'eq', 'on') | list | count }} / 8
      - type: grid
        cards:
          - type: heading
            heading: Afficher / masquer un onglet
            icon: mdi:eye-settings-outline
          - type: tile
            entity: input_boolean.kimia_onglet_lumieres
            name: Lumières
            icon: mdi:lightbulb-group-outline
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_volets
            name: Volets
            icon: mdi:window-shutter
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_climatisation
            name: Climatisation
            icon: mdi:air-conditioner
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_musique
            name: Musique
            icon: mdi:music
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_securite
            name: Sécurité
            icon: mdi:shield-home-outline
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_prises
            name: Prises
            icon: mdi:power-socket-eu
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_actualites
            name: Actualités
            icon: mdi:newspaper-variant-outline
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: input_boolean.kimia_onglet_parametres
            name: Paramètres
            icon: mdi:cog-outline
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - type: grid
        cards:
          - type: heading
            heading: Configuration des pièces
            icon: mdi:floor-plan
          - type: markdown
            content: >-
              Pour créer des pièces et ajouter des équipements, ouvrez
              le deuxième onglet **Pièces et appareils**.
      - type: grid
        cards:
          - type: heading
            heading: Informations
            icon: mdi:information-outline
          - type: markdown
            content: >-
              **Attention :** masquer un onglet retire son bouton
              de la Navbar KIMIA, mais ne masque pas les onglets natifs
              Home Assistant et ne bloque pas l'accès direct aux pages.
              Cela ne constitue pas une sécurité.
              Réservez ce dashboard Administration aux comptes
              administrateurs depuis **Paramètres > Tableaux de bord**.
  - title: Pièces et appareils
    path: pieces-equipements
    icon: mdi:home-plus-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: KIMIA · Pièces et appareils
            icon: mdi:home-plus-outline
          - type: markdown
            content: >-
              Créez et modifiez les pièces et les étages directement ici.
              Affectez ensuite les appareils déjà installés à leur pièce.
              L'appairage Zigbee via ZHA est la prochaine étape.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "1 · Configurer les pièces dans KIMIA"
            icon: mdi:floor-plan
          - type: custom:kimia-room-manager-card
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: "2 · Ajouter les équipements"
            icon: mdi:devices
          - type: button
            name: "Ajouter une prise Zigbee (ZHA)"
            icon: mdi:zigbee
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /config/zha/dashboard
          - type: button
            name: "Ajouter une intégration / un appareil"
            icon: mdi:puzzle-plus-outline
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /config/integrations/dashboard
          - type: button
            name: "Voir et organiser les appareils"
            icon: mdi:devices
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /config/devices/dashboard
          - type: markdown
            content: >-
              Pour une prise Zigbee, mettez-la en mode appairage puis ouvrez
              **Zigbee (ZHA) → Ajouter un appareil**. Ce raccourci nécessite
              ZHA installé. Avec Zigbee2MQTT ou le Wi-Fi, utilisez plutôt
              l'intégration correspondante.
      - type: grid
        cards:
          - type: heading
            heading: "3 · Ranger les appareils dans les pièces"
            icon: mdi:home-switch-outline
          - type: markdown
            content: |
              1. Créez vos pièces dans la carte **KIMIA · Gestion des pièces**.
              2. Appairez les équipements via ZHA si nécessaire.
              3. Cliquez sur une pièce dans la carte KIMIA et choisissez
                 l'appareil dans la liste pour l'y associer.

              **Attention :** créer une zone n'ajoute pas automatiquement
              une carte à la vue personnalisée KIMIA. Cette fonction
              demanderait un développement supplémentaire.

              **Accès administrateur Home Assistant requis.**
