title: KIMIA Smart
button_card_templates:
  kimia_v2_tile:
    section_mode: true
    show_name: true
    show_icon: true
    show_state: false
    show_label: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: var(--ha-card-background, var(--card-background-color, #ffffff))
        - color: var(--primary-text-color)
        - border: 1px solid var(--divider-color)
        - border-radius: 17px
        - box-shadow: 0 3px 12px rgba(0, 30, 53, .05)
        - padding: 8px 10px
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 36px minmax(0, 1fr)
        - grid-template-rows: 1fr 1fr
        - column-gap: 6px
      img_cell:
        - width: 32px
        - height: 32px
        - border-radius: 11px
        - background: rgba(22, 165, 166, .11)
        - justify-self: start
        - align-self: center
      icon:
        - width: 19px
        - color: '#29B7AE'
      name:
        - color: var(--primary-text-color)
        - font-size: 12px
        - font-weight: 750
        - justify-self: start
        - align-self: end
        - text-align: left
        - white-space: nowrap
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
      label:
        - color: var(--secondary-text-color)
        - font-size: 10px
        - justify-self: start
        - align-self: start
        - margin-top: 2px
        - text-align: left
        - white-space: nowrap
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
  kimia_v08_scene:
    section_mode: true
    show_name: true
    show_icon: true
    show_state: false
    show_label: true
    triggers_update: all
    label: |
      [[[
        const ident = entity?.entity_id || '';
        const cfg = 'input_text.kimia_cible_' + ident.replace('script.kimia_', '');
        const val = states[cfg]?.state || '';
        return val.startsWith('script.') && !val.startsWith('script.kimia_') ? 'Prêt · toucher' : 'À associer';
      ]]]
    styles:
      card:
        - background: 'linear-gradient(115deg, var(--card-background-color), rgba(30,120,130,.15))'
        - color: var(--primary-text-color)
        - border: '1px solid var(--ha-card-border-color, rgba(50,205,190,.32))'
        - border-radius: 20px
        - box-shadow: '0 5px 17px rgba(0,33,60,.12)'
        - padding: '11px 15px'
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: '45px minmax(0,1fr)'
        - grid-template-rows: '1fr 1fr'
        - column-gap: 8px
      img_cell:
        - height: 43px
        - width: 43px
        - border-radius: 14px
        - background: 'rgba(57,199,185,.13)'
      icon:
        - width: 25px
        - color: '[[[ return variables.couleur || "#42D4C3"; ]]]'
      name:
        - font-size: 14px
        - font-weight: 700
        - justify-self: start
        - align-self: end
        - color: var(--primary-text-color)
      label:
        - font-size: 11px
        - justify-self: start
        - align-self: start
        - color: var(--secondary-text-color)
views:
    # KIMIA Smart V0.8 — PAGE D'ACCUEIL TABLETTE
    # Maquette seule dans une vue panel : édition native et hauteur d'écran,
    # aucun empilement de cartes qui obligerait à défiler sur tablette.
    # Plan générique de démonstration : NE représente PAS le logement du client.
  - title: Accueil
    path: accueil
    icon: mdi:home-variant
    type: panel
    cards:
      - type: custom:maquette-card
        id: kimia_plan_accueil_v08
        title: "KIMIA Smart · plan témoin à personnaliser"
        language: fr
        full_page: true
        margin: 25
        summary: false
        legend: false
        room_labels:
          name: true
          temperature: false
          humidity: false
        temperature_tint: false
        # Le mode tablette conserve volontairement le panneau des commandes.
        # Maquette ajuste automatiquement la hauteur à l'écran.
        tablet:
          summary: false
          panels: true
          burn_in: true
        animation_level: reduced
        ambience:
          day_night:
            sun: sun.sun
            intensity: 0.95
            marker: false
          weather:
            entity: weather.forecast_lbv
            intensity: 0.7
            direction: wind
        panels:
          right:
            - type: tile
              title: "Libreville · météo"
              icon: mdi:weather-partly-cloudy
              color: "#F4C85A"
              entity: sensor.kimia_temperature_libreville
              unit: "°C"
              decimals: 0
              rows:
                - entity: sensor.kimia_humidite_libreville
                  name: Humidité
                  icon: mdi:water-percent
                  decimals: 0
            - type: entities
              title: "Ma maison · raccourcis"
              icon: mdi:gesture-tap-button
              entities:
                - entity: script.kimia_au_lit
                  name: Au lit
                  icon: mdi:bed-clock
                - entity: script.kimia_depart
                  name: Départ
                  icon: mdi:door-open
                - entity: script.kimia_retour
                  name: Retour
                  icon: mdi:home-import-outline
                - entity: script.kimia_reveil
                  name: Réveil
                  icon: mdi:weather-sunset-up
            - type: entities
              title: "L'info en bref"
              icon: mdi:newspaper-variant-outline
              entities:
                - entity: sensor.kimia_flash_gabon
                  name: Gabon
                  icon: mdi:flag-variant
                - entity: sensor.kimia_flash_monde
                  name: Monde
                  icon: mdi:earth
        # PLAN TÉMOIN, SANS AUCUNE COMMANDE D'ÉQUIPEMENT :
        # à redessiner depuis Maquette (administrateur) pour le logement réel.
        # Une vraie installation doit aussi associer les pièces HA et capteurs.
        rooms:
          - name: Séjour
            poly: [[0, 0], [470, 0], [470, 370], [0, 370]]
            label: [235, 185]
          - name: Cuisine
            poly: [[470, 0], [800, 0], [800, 220], [470, 220]]
            label: [635, 110]
          - name: Salle d'eau
            poly: [[470, 220], [800, 220], [800, 370], [470, 370]]
            label: [635, 295]
          - name: Chambre 1
            poly: [[0, 370], [320, 370], [320, 670], [0, 670]]
            label: [160, 520]
          - name: Chambre 2
            poly: [[320, 370], [580, 370], [580, 670], [320, 670]]
            label: [450, 520]
          - name: Entrée
            poly: [[580, 370], [800, 370], [800, 670], [580, 670]]
            label: [690, 520]
        walls:
          - [0, 0, 800, 0]
          - [800, 0, 800, 670]
          - [800, 670, 0, 670]
          - [0, 670, 0, 0]
          - [470, 0, 470, 370]
          - [470, 220, 800, 220]
          - [0, 370, 800, 370]
          - [320, 370, 320, 670]
          - [580, 370, 580, 670]
  - title: Lumières
    path: lumieres
    icon: mdi:lightbulb-group-outline
    type: sections
    max_columns: 2
    sections:
