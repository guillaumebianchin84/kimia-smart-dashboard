            label: |
              [[[
                const n=Object.values(states).filter(e=>e.entity_id?.startsWith('binary_sensor.') && ['door','window','opening'].includes(e.attributes?.device_class) && e.state==='on').length;
                return n+' actif'+(n>1?'s':'');
              ]]]
            tap_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
