title: KIMIA Smart
button_card_templates:
  kimia_v2_tile:
    section_mode: true
    show_name: true
    show_icon: true
    show_state: false
    show_label: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: var(--ha-card-background, var(--card-background-color, #ffffff))
        - color: var(--primary-text-color)
        - border: 1px solid var(--divider-color)
        - border-radius: 17px
        - box-shadow: 0 3px 12px rgba(0, 30, 53, .05)
        - padding: 8px 10px
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 36px minmax(0, 1fr)
        - grid-template-rows: 1fr 1fr
        - column-gap: 6px
      img_cell:
        - width: 32px
        - height: 32px
        - border-radius: 11px
        - background: rgba(22, 165, 166, .11)
        - justify-self: start
        - align-self: center
      icon:
        - width: 19px
        - color: '#29B7AE'
      name:
        - color: var(--primary-text-color)
        - font-size: 12px
        - font-weight: 750
        - justify-self: start
        - align-self: end
        - text-align: left
        - white-space: nowrap
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
      label:
        - color: var(--secondary-text-color)
        - font-size: 10px
        - justify-self: start
        - align-self: start
        - margin-top: 2px
        - text-align: left
        - white-space: nowrap
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
views:
  - title: Accueil
    path: accueil
    icon: mdi:home-variant-outline
    type: sections
    max_columns: 2
    sections:
      # 01 — Bandeau compact, environ deux fois moins haut que le premier test.
      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            section_mode: true
            grid_options:
              columns: full
              rows: auto
            show_icon: false
            show_name: false
            show_label: false
            tap_action:
              action: none
            triggers_update: []
            custom_fields:
              brand: |
                [[[
                  return `<div style="font-size:22px;font-weight:850;line-height:1.1;letter-spacing:-.7px">KIMIA<span style="color:#43D9CE"> Smart</span></div>
                  <div style="font-size:9px;font-weight:750;color:#C3E0E8;letter-spacing:2px;margin-top:4px">BY PROMAINT</div>`;
                ]]]
              hello: |
                [[[
                  const h = new Date().getHours();
                  const salutation = h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
                  return `<div style="font-size:11px;color:#D7EDF3;text-align:right">${salutation}<br/>Votre maison, tout simplement.</div>`;
                ]]]
            styles:
              card:
                - background: 'linear-gradient(117deg, #0D324F 0%, #15597B 65%, #137D87 100%)'
                - border: '1px solid rgba(255,255,255,.12)'
                - border-radius: 19px
                - padding: 14px 16px
                - color: '#FFFFFF'
                - box-shadow: '0 5px 16px rgba(0,45,68,.13)'
              grid:
                - grid-template-areas: '"brand hello"'
                - grid-template-columns: minmax(0,1fr) auto
                - grid-template-rows: auto
                - align-items: center
                - column-gap: 8px
              custom_fields:
                brand:
                  - justify-self: start
                  - text-align: left
                hello:
                  - justify-self: end
                  - text-align: right
    
      # 02 — Météo Libreville. La localisation et les capteurs sont adaptés au client.
          - type: heading
            heading: Météo · Libreville
            icon: mdi:weather-partly-cloudy
            visibility:
              - condition: state
                entity: input_select.kimia_meteo_visible
                state: "Oui"
            grid_options:
              columns: full
              rows: 1
          - type: custom:button-card
            entity: weather.forecast_lbv
            show_icon: true
            show_name: false
            show_state: false
            show_label: false
            icon: |
              [[[
                const icons = {
                  'sunny': 'mdi:weather-sunny',
                  'clear-night': 'mdi:weather-night',
                  'partlycloudy': 'mdi:weather-partly-cloudy',
                  'cloudy': 'mdi:weather-cloudy',
                  'rainy': 'mdi:weather-rainy',
                  'pouring': 'mdi:weather-pouring',
                  'lightning': 'mdi:weather-lightning',
                  'lightning-rainy': 'mdi:weather-lightning-rainy',
                  'fog': 'mdi:weather-fog',
                  'windy': 'mdi:weather-windy',
                  'windy-variant': 'mdi:weather-windy-variant',
                  'hail': 'mdi:weather-hail',
                  'snowy': 'mdi:weather-snowy',
                  'snowy-rainy': 'mdi:weather-snowy-rainy'
                };
                return icons[entity?.state] || 'mdi:weather-partly-cloudy';
              ]]]
            tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: input_select.kimia_meteo_visible
                state: "Oui"
            grid_options:
              columns: full
              rows: auto
            custom_fields:
              location: |
                [[[
                  return '<span style="font-size:11px;font-weight:800;letter-spacing:1.8px;color:#A8F6EC">LIBREVILLE · GABON</span>';
                ]]]
              temperature: |
                [[[
                  const t = entity?.attributes?.temperature;
                  const value = t !== undefined && t !== null && !Number.isNaN(Number(t))
                    ? Number(t).toFixed(1).replace('.', ',') : '—';
                  return '<span style="font-size:49px;font-weight:800;letter-spacing:-2px;line-height:1">' + value +
                    '<span style="font-size:21px;font-weight:500;margin-left:5px;letter-spacing:0">°C</span></span>';
                ]]]
              condition: |
                [[[
                  const labels = {
                    'sunny':'Ensoleillé', 'clear-night':'Ciel dégagé',
                    'partlycloudy':'Partiellement nuageux', 'cloudy':'Nuageux',
                    'rainy':'Pluie', 'pouring':'Fortes pluies',
                    'lightning':'Orage', 'lightning-rainy':'Orages et pluie',
                    'fog':'Brouillard', 'windy':'Venteux',
                    'windy-variant':'Venteux et nuageux', 'hail':'Grêle',
                    'snowy':'Neige', 'snowy-rainy':'Neige et pluie'
                  };
                  return '<span style="font-size:14px;color:#E1F5F5">' +
                    (labels[entity?.state] || 'Météo actuelle') + '</span>';
                ]]]
              details: |
                [[[
                  const a = entity?.attributes || {};
                  const parts = [];
                  if (a.humidity !== undefined && a.humidity !== null)
                    parts.push('Humidité ' + a.humidity + ' %');
                  if (a.wind_speed !== undefined && a.wind_speed !== null)
                    parts.push('Vent ' + a.wind_speed + ' ' + (a.wind_speed_unit || 'km/h'));
                  return '<span style="font-size:11px;color:#D1E9EE">' +
                    (parts.length ? parts.join('  ·  ') : 'Conditions actualisées automatiquement') +
                    '</span>';
                ]]]
            styles:
              card:
                - background: 'linear-gradient(115deg, #0D324F 0%, #15597B 63%, #138586 100%)'
                - color: '#FFFFFF'
                - border: '1px solid rgba(255,255,255,.13)'
                - border-radius: 20px
                - box-shadow: '0 5px 16px rgba(0,35,55,.14)'
                - padding: 17px 22px
                - overflow: hidden
              grid:
                - grid-template-areas: '"location i" "temperature i" "condition i" "details details"'
                - grid-template-columns: 'minmax(0, 1fr) 80px'
                - grid-template-rows: 'auto auto auto auto'
                - row-gap: 4px
                - align-items: center
              img_cell:
                - grid-area: i
                - justify-self: end
                - align-self: center
                - width: 76px
                - height: 76px
              icon:
                - width: 60px
                - height: 60px
                - color: '#C9FFF5'
              custom_fields:
                location:
                  - justify-self: start
                  - text-align: left
                temperature:
                  - justify-self: start
                  - text-align: left
                condition:
                  - justify-self: start
                  - text-align: left
                details:
                  - justify-self: start
                  - text-align: left
                  - margin-top: 10px
          - type: weather-forecast
