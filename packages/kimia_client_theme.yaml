# KIMIA Smart — préférences historiques et compatibilité V1.6.1.
# Les thèmes sont maintenant sélectionnés LOCALement dans KIMIA.
# Ce package n'installe aucun matériel ni scénario domotique.
# Home Assistant doit déjà charger les packages (homeassistant.packages).
input_select:
  kimia_meteo_visible:
    name: Météo sur l'accueil KIMIA
    icon: mdi:weather-partly-cloudy
    options:
      - "Oui"
      - "Non"
  kimia_journal_visible:
    name: Journal sur l'accueil KIMIA
    icon: mdi:newspaper-variant-outline
    options:
      - "Oui"
      - "Non"
  kimia_theme_global:
    name: Thème KIMIA pour la maison
    icon: mdi:palette-outline
    options:
      - KIMIA Gris Premium
      - KIMIA Clair
      - KIMIA Sombre
      - KIMIA Signature
      - KIMIA Vert Sauge
      - KIMIA Violet Nuit
      - KIMIA Sable Doré
      - KIMIA Terracotta
    # PAS de initial: le dernier choix est restauré après redémarrage.

# Depuis KIMIA V1.6.1, le choix des thèmes est EXCLUSIVEMENT local
# au navigateur. L'ancien input_select reste déclaré pour compatibilité
# avec les configurations précédentes, MAIS AUCUNE automatisation ne doit
# plus appeler frontend.set_theme suite à son changement.
# Cette suppression prend effet au prochain redémarrage HA.
