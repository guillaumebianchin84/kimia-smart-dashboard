# KIMIA Smart V0.8 — scripts de façade et capteurs de synthèse.
# Chaque scène renvoie vers un script réel choisi par l'installateur.
# Aucun appareil n'est actionné si la scène n'est pas associée.
# Installer UNE SEULE FOIS sous /config/packages/kimia_tablette_v08.yaml.
# Ne pas mettre d'identifiants/jetons dans ce fichier.
input_text:
  kimia_cible_au_lit:
    name: "Scénario KIMIA · Au lit — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
  kimia_cible_depart:
    name: "Scénario KIMIA · Départ — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
  kimia_cible_retour:
    name: "Scénario KIMIA · Retour — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
  kimia_cible_reveil:
    name: "Scénario KIMIA · Réveil — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
  kimia_cible_ambiance_detente:
    name: "Scénario KIMIA · Ambiance détente — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
  kimia_cible_ambiance_soiree:
    name: "Scénario KIMIA · Ambiance soirée — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
  kimia_cible_ambiance_cinema:
    name: "Scénario KIMIA · Ambiance cinéma — script cible"
    icon: mdi:link-variant
    max: 120
    mode: text
script:
  kimia_au_lit:
    alias: "KIMIA · Au lit"
    icon: mdi:bed-clock
    mode: single
    sequence:
      - variables:
          cible: "{{ states('input_text.kimia_cible_au_lit') | trim }}"
      - if:
          - condition: template
            value_template: >-
              {{ cible.startswith('script.') and
                 not cible.startswith('script.kimia_') and
                 states(cible) not in ['unknown','unavailable'] }}
        then:
          - action: script.turn_on
            target:
              entity_id: "{{ cible }}"
        else:
          - action: persistent_notification.create
            data:
              title: "KIMIA Smart · Au lit"
              message: >-
                Scénario non configuré. L'installateur doit renseigner
                input_text.kimia_cible_au_lit avec l'identifiant
                d'un script Home Assistant existant (script.xxx).
