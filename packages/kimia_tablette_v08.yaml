template:
  - sensor:
      - name: 'KIMIA Température Libreville'
        unique_id: kimia_temperature_libreville
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: '°C'
        state: >-
          {% set t = state_attr('weather.forecast_lbv', 'temperature') %}
          {{ t if t is number else 'unknown' }}
      - name: 'KIMIA Humidité Libreville'
        unique_id: kimia_humidite_libreville
        icon: mdi:water-percent
        unit_of_measurement: '%'
        state: >-
          {% set h = state_attr('weather.forecast_lbv', 'humidity') %}
          {{ h if h is number else 'unknown' }}
      - name: 'KIMIA Flash Gabon'
        unique_id: kimia_flash_gabon
        icon: mdi:newspaper
        state: >-
          {% set a = state_attr('sensor.rss_gabon_actu', 'articles') %}
          {% if a is sequence and a | length > 0 and a[0] is mapping %}
            {{ (a[0].get('title', '') | string)[:110] }}
          {% else %}
            Actualités en attente
          {% endif %}
      - name: 'KIMIA Flash Monde'
        unique_id: kimia_flash_monde
        icon: mdi:earth
        state: >-
          {% set a = state_attr('sensor.rss_france_24', 'articles') %}
          {% if a is sequence and a | length > 0 and a[0] is mapping %}
            {{ (a[0].get('title', '') | string)[:110] }}
          {% else %}
            Actualités en attente
          {% endif %}
