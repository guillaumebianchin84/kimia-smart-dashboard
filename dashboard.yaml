# KIMIA Smart V0.8 - source YAML modulaire ; maquette est l'accueil
# Pour déplacer les cartes dans l'éditeur visuel, importer dashboard-ui-import.yaml dans un dashboard géré par l'UI.
title: KIMIA Smart
button_card_templates:
  kimia_v2_tile:
    section_mode: true
    show_name: true
    show_icon: true
    show_state: false
    show_label: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: var(--ha-card-background, var(--card-background-color, #ffffff))
        - color: var(--primary-text-color)
        - border: 1px solid var(--divider-color)
        - border-radius: 17px
        - box-shadow: 0 3px 12px rgba(0, 30, 53, .05)
        - padding: 8px 10px
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 36px minmax(0, 1fr)
        - grid-template-rows: 1fr 1fr
        - column-gap: 6px
      img_cell:
        - width: 32px
        - height: 32px
        - border-radius: 11px
        - background: rgba(22, 165, 166, .11)
        - justify-self: start
        - align-self: center
      icon:
        - width: 19px
        - color: '#29B7AE'
      name:
        - color: var(--primary-text-color)
        - font-size: 12px
        - font-weight: 750
        - justify-self: start
        - align-self: end
        - text-align: left
        - white-space: nowrap
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
      label:
        - color: var(--secondary-text-color)
        - font-size: 10px
        - justify-self: start
        - align-self: start
        - margin-top: 2px
        - text-align: left
        - white-space: nowrap
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
  kimia_v08_scene:
    section_mode: true
    show_name: true
    show_icon: true
    show_state: false
    show_label: true
    triggers_update: all
    label: |
      [[[
        const ident = entity?.entity_id || '';
        const cfg = 'input_text.kimia_cible_' + ident.replace('script.kimia_', '');
        const val = states[cfg]?.state || '';
        return val.startsWith('script.') && !val.startsWith('script.kimia_') ? 'Prêt · toucher' : 'À associer';
      ]]]
    styles:
      card:
        - background: 'linear-gradient(115deg, var(--card-background-color), rgba(30,120,130,.15))'
        - color: var(--primary-text-color)
        - border: '1px solid var(--ha-card-border-color, rgba(50,205,190,.32))'
        - border-radius: 20px
        - box-shadow: '0 5px 17px rgba(0,33,60,.12)'
        - padding: '11px 15px'
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: '45px minmax(0,1fr)'
        - grid-template-rows: '1fr 1fr'
        - column-gap: 8px
      img_cell:
        - height: 43px
        - width: 43px
        - border-radius: 14px
        - background: 'rgba(57,199,185,.13)'
      icon:
        - width: 25px
        - color: '[[[ return variables.couleur || "#42D4C3"; ]]]'
      name:
        - font-size: 14px
        - font-weight: 700
        - justify-self: start
        - align-self: end
        - color: var(--primary-text-color)
      label:
        - font-size: 11px
        - justify-self: start
        - align-self: start
        - color: var(--secondary-text-color)
navbar-templates:
  kimia_navigation:
    desktop:
      mode: floating
      position: left
      min_width: 768
      show_labels: false
    mobile:
      mode: floating
      show_labels: true
      safe_area: true
    layout:
      reflect_child_state: true
      auto_padding:
        enabled: true
        desktop_px: 90
        mobile_px: 85
    styles: |
      .navbar {
        --navbar-primary-color: #35D7C7;
        --navbar-border-radius: 21px;
        --navbar-background-color: var(--card-background-color);
        --navbar-route-icon-size: 23px;
      }
    routes:
      - url: /kimia-smart/accueil
        icon: mdi:home-variant
        label: Accueil
        selected_color: '#35D7C7'
      - url: /kimia-smart/lumieres
        icon: mdi:lightbulb-group-outline
        label: Lumières
        selected_color: '#FBC75F'
      - url: /kimia-smart/volets
        icon: mdi:window-shutter
        label: Volets
        selected_color: '#35D7C7'
      - url: /kimia-smart/climatisation
        icon: mdi:air-conditioner
        label: Clim
        selected_color: '#69C9FF'
      - url: /kimia-smart/musique
        icon: mdi:music-note
        label: Musique
        hidden: |
          [[[ return !navbar.isDesktop; ]]]
      - url: /kimia-smart/securite
        icon: mdi:shield-home-outline
        label: Sécurité
        hidden: |
          [[[ return !navbar.isDesktop; ]]]
      - url: /kimia-smart/prises
        icon: mdi:power-socket-eu
        label: Prises
        hidden: |
          [[[ return !navbar.isDesktop; ]]]
      - url: /kimia-smart/actualites
        icon: mdi:newspaper-variant-outline
        label: Actualités
        hidden: |
          [[[ return !navbar.isDesktop; ]]]
      - url: /kimia-smart/parametres
        icon: mdi:cog-outline
        label: Paramètres
        hidden: |
          [[[ return !navbar.isDesktop; ]]]
      - icon: mdi:dots-horizontal
        label: Plus
        hidden: |
          [[[ return navbar.isDesktop; ]]]
        tap_action:
          action: open-popup
        popup:
          - url: /kimia-smart/musique
            icon: mdi:music-note
            label: Musique
          - url: /kimia-smart/securite
            icon: mdi:shield-home-outline
            label: Sécurité
          - url: /kimia-smart/prises
            icon: mdi:power-socket-eu
            label: Prises
          - url: /kimia-smart/actualites
            icon: mdi:newspaper-variant-outline
            label: Actualités
          - url: /kimia-smart/parametres
            icon: mdi:cog-outline
            label: Paramètres
# Kiosk Mode est nécessaire pour retirer les menus Home Assistant.
# Pas de modification de permissions, uniquement un masquage visuel.
kiosk_mode:
  non_admin_settings:
    hide_sidebar: true
    hide_header: true
views:
  - !include /config/kimia/views/01-accueil.yaml
  - !include /config/kimia/views/02-lumieres.yaml
  - !include /config/kimia/views/03-volets.yaml
  - !include /config/kimia/views/04-climatisation.yaml
  - !include /config/kimia/views/05-musique.yaml
  - !include /config/kimia/views/06-securite.yaml
  - !include /config/kimia/views/08-prises.yaml
  - !include /config/kimia/views/11-actualites.yaml
  - !include /config/kimia/views/07-parametres.yaml
